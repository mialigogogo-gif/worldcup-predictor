"塞内加尔":[4,75,79,70,1695,17],"克罗地亚":[4,74,76,80,1735,12],"摩洛哥":[4,74,78,71,1700,16],"墨西哥":[4,75,73,72,1698,14],
"挪威":[4,80,72,69,1680,19],"土耳其":[3,74,70,72,1640,23],"韩国":[3,72,70,73,1635,22],"瑞典":[3,71,72,68,1620,24],
"厄瓜多尔":[3,76,78,72,1660,20],"埃及":[2,73,70,68,1580,25],"伊朗":[2,70,72,66,1590,28],"加纳":[2,68,66,64,1510,35],
"巴拉圭":[2,68,73,64,1525,32],"澳大利亚":[2,68,71,65,1540,29],"阿尔及利亚":[2,72,70,68,1530,30],"捷克":[2,68,70,66,1515,33],
"苏格兰":[2,66,70,67,1505,34],"科特迪瓦":[2,70,70,66,1530,30],"沙特":[1,68,66,64,1450,31],"突尼斯":[1,65,70,62,1460,37],
"新西兰":[1,61,63,58,1400,43],"佛得角":[1,64,65,60,1430,40],"伊拉克":[1,62,64,60,1410,42],"约旦":[1,60,62,58,1380,46],
"乌兹别克斯坦":[1,64,66,62,1440,39],"刚果（金）":[1,62,64,60,1360,52],"巴拿马":[1,60,61,58,1370,47],"南非":[1,63,64,62,1390,45],
"波黑":[1,65,62,64,1395,44],"卡塔尔":[1,60,58,60,1350,50],"海地":[1,58,58,55,1320,60],"库拉索":[1,58,60,55,1365,48]

["2026-06-23","08:00","I组 第2轮","挪威","塞内加尔","未开始","","温哥华球场"],

const liveFeed={
"突尼斯-日本":{minute:"67'",score:"0-2",possession:[43,57],shots:[7,12],onTarget:[2,5],xg:[0.62,1.91],corners:[3,5],yellow:[1,0]},
"荷兰-瑞典":{minute:"FT",score:"5-1",possession:[60,40],shots:[15,8],onTarget:[8,3],xg:[3.45,0.88],corners:[7,3],yellow:[1,2]},
"德国-科特迪瓦":{minute:"FT",score:"2-1",possession:[58,42],shots:[14,9],onTarget:[6,4],xg:[2.1,1.2],corners:[6,4],yellow:[0,2]}
};

const results=[
["荷兰","日本","2-2"],["瑞典","突尼斯","5-1"],
["德国","库拉索","7-1"],["科特迪瓦","厄瓜多尔","1-0"],
["荷兰","瑞典","5-1"],["德国","科特迪瓦","2-1"],["厄瓜多尔","库拉索","0-0"],["突尼斯","日本","0-2"]
];

const h2h={
"突尼斯-日本":["近3次：突尼斯 1胜｜平0｜日本 2胜","2022 日本 0-3 突尼斯","2015 日本 2-0 突尼斯","2002 日本 2-0 突尼斯"],
"荷兰-瑞典":["近5次：荷兰 3胜｜平1｜瑞典 1胜","2017 荷兰 2-0 瑞典","2016 瑞典 1-1 荷兰","2011 荷兰 3-2 瑞典"],
"西班牙-沙特":["样本少：西班牙纸面实力明显占优","2012 西班牙 5-0 沙特"],
"比利时-伊朗":["历史交锋样本较少，按实力模型估算","比利时控球和进攻创造力占优"]
};

function allTeams(){return Object.values(groups).flat()}
function groupOf(t){for(let g in groups){if(groups[g].includes(t))return g}return "-"}
function data(t){let p=power[t]||[1,62,62,62,1300,99];return{prob:p[0],atk:p[1],def:p[2],ctl:p[3],elo:p[4],rank:p[5]}}
function strength(t){let x=data(t);return x.atk*.45+x.def*.35+x.ctl*.2}
function winProb(a,b){let diff=strength(a)-strength(b);return Math.max(10,Math.min(85,50+diff*1.3))}
function pickWinner(a,b){return Math.random()*100<winProb(a,b)?a:b}
function parseScore(s){let [a,b]=s.split("-").map(Number);return[a,b]}
function key(a,b){return a+"-"+b}
function live(a,b){return liveFeed[key(a,b)]||liveFeed[key(b,a)]||null}

function standings(g){
let table={};groups[g].forEach(t=>table[t]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
results.forEach(r=>{
let [a,b,s]=r;if(groupOf(a)!==g||groupOf(b)!==g)return;
let [ga,gb]=parseScore(s);table[a].p++;table[b].p++;table[a].gf+=ga;table[a].ga+=gb;table[b].gf+=gb;table[b].ga+=ga;
if(ga>gb){table[a].w++;table[b].l++;table[a].pts+=3}else if(ga<gb){table[b].w++;table[a].l++;table[b].pts+=3}else{table[a].d++;table[b].d++;table[a].pts++;table[b].pts++}
});
return Object.values(table).sort((x,y)=>y.pts-x.pts||((y.gf-y.ga)-(x.gf-x.ga))||y.gf-x.gf);
}

function qualifyProb(t){
let g=groupOf(t),st=standings(g),pos=st.findIndex(x=>x.team===t)+1,base=Math.round(strength(t)-8);
if(pos===1)base+=12;if(pos===2)base+=6;if(pos===4)base-=10;
return Math.max(5,Math.min(95,base));
}

function form(t){let s=Math.round(strength(t));return s>82?["W","W","D","W","L"]:s>75?["W","D","W","L","W"]:s>68?["D","W","L","D","W"]:["L","D","L","W","D"]}
function formHTML(t){return form(t).map(x=>`<span class="pill ${x=="W"?"win":x=="D"?"draw":"loss"}">${x}</span>`).join("")}

function predictMatch(a,b){
let A=data(a),B=data(b),L=live(a,b);
let aw=Math.round(winProb(a,b)),bw=Math.round(100-aw-26),dr=100-aw-bw;if(bw<8){bw=8;dr=100-aw-bw}
let pa=Math.max(38,Math.min(68,Math.round(50+(A.ctl-B.ctl)*.8))),pb=100-pa;
let xga=Math.max(.3,(A.atk*.04+A.ctl*.01-B.def*.025)).toFixed(2),xgb=Math.max(.3,(B.atk*.04+B.ctl*.01-A.def*.025)).toFixed(2);
let sa=Math.round(Number(xga)*5+4),sb=Math.round(Number(xgb)*5+4),oa=Math.max(1,Math.round(sa*.38)),ob=Math.max(1,Math.round(sb*.38));
let ca=Math.max(1,Math.round(pa/13+Number(xga))),cb=Math.max(1,Math.round(pb/13+Number(xgb)));
if(L){pa=L.possession[0];pb=L.possession[1];sa=L.shots[0];sb=L.shots[1];oa=L.onTarget[0];ob=L.onTarget[1];xga=L.xg[0];xgb=L.xg[1];ca=L.corners[0];cb=L.corners[1]}
let ga=Math.max(0,Math.round(Number(xga))),gb=Math.max(0,Math.round(Number(xgb)));
if(aw>60&&ga<=gb)ga=gb+1;if(bw>55&&gb<=ga)gb=ga+1;
let top=[[ga+"-"+gb,22],[Math.max(0,ga+1)+"-"+gb,18],[ga+"-"+Math.max(0,gb-1),15],[Math.max(0,ga-1)+"-"+gb,12],[ga+"-"+(gb+1),10]];
let reason=`${a}综合强度${Math.round(strength(a))}，${b}综合强度${Math.round(strength(b))}。${A.ctl>B.ctl?a+"控球更强，预计掌握更多球权。":b+"控球更强，"+a+"可能更多依靠反击。"}模型倾向：${aw>=bw?a:b}不败。`;
return{aw,bw,dr,score:ga+"-"+gb,pa,pb,xga,xgb,sa,sb,oa,ob,ca,cb,top,reason,conf:Math.max(aw,bw,dr)}
}

function init(){
team.innerHTML=allTeams().map(t=>`<option value="${t}">${flag[t]} ${t}｜${groupOf(t)}组</option>`).join("");
let dates=[...new Set(schedule.map(x=>x[0]))];
matchDate.innerHTML=dates.map(d=>`<option value="${d}">${d}</option>`).join("");
predictTeam();renderMatches();renderGroups();renderRanking();renderUpdate();
}

function predictTeam(){
let t=team.value,x=data(t);
teamResult.innerHTML=`<div class="match"><div class="flag">${flag[t]}</div><div class="big">${t}</div><p>${groupOf(t)}组｜夺冠概率 ${x.prob}%｜FIFA积分 ${x.elo}</p><div class="barbg"><div class="bar" style="width:${x.prob*3}%"></div></div><div class="grid"><div class="box">进攻 ${x.atk}</div><div class="box">防守 ${x.def}</div><div class="box">控球 ${x.ctl}</div><div class="box">综合 ${Math.round(strength(t))}</div></div><h3>核心球员</h3><p>${players[t]||"暂无详细核心球员数据"}</p></div>`;
}

function h2hHTML(a,b){let arr=h2h[key(a,b)]||h2h[key(b,a)]||["历史交锋样本不足，按同级别赛事估算。","暂无更多记录。"];return arr.map(x=>`<p>${x}</p>`).join("")}
function firstRoundHTML(a,b){function line(t){let r=results.find(x=>x[0]===t||x[1]===t);return r?`${t}：${r[0]} ${r[2]} ${r[1]}`:`${t}：暂无首轮记录`;}return `<p>${line(a)}</p><p>${line(b)}</p>`}

function statusBadge(s,L){
if(s==="进行中")return `<span class="live">🔴 LIVE ${L?L.minute:""}</span>`;
if(s==="已完赛")return `<span class="done">已完赛</span>`;
return `<span class="future">未开始</span>`;
}

function renderMatches(){
let date=matchDate.value,html="";
schedule.filter(m=>m[0]===date).forEach(m=>{
let [d,time,stage,a,b,status,realScore,stadium]=m,p=predictMatch(a,b),A=data(a),B=data(b),g=groupOf(a),st=standings(g),L=live(a,b);
let showScore=(L&&L.score)||realScore||p.score;
html+=`<div class="match">
<div class="center"><p>${statusBadge(status,L)}</p><p class="muted">${stage}</p>
<div class="row"><div><div class="flag">${flag[a]}</div><h2 class="orange">${a}</h2><p>FIFA积分 ${A.elo}</p></div><div><h1>VS</h1><p>${d} ${time}</p><p>${stadium}</p></div><div><div class="flag">${flag[b]}</div><h2 class="yellow">${b}</h2><p>FIFA积分 ${B.elo}</p></div></div>
<div class="score">${showScore}</div></div>

<h3>实时/预测数据</h3>
<div class="grid"><div class="box">${a}<br>控球 ${p.pa}%<br>xG ${p.xga}<br>射门 ${p.sa}<br>射正 ${p.oa}<br>角球 ${p.ca}</div><div class="box">${b}<br>控球 ${p.pb}%<br>xG ${p.xgb}<br>射门 ${p.sb}<br>射正 ${p.ob}<br>角球 ${p.cb}</div></div>

<h3>实力评分</h3>
<div class="barbg"><div class="bar" style="width:${Math.min(100,A.elo/22)}%;background:linear-gradient(90deg,#f97316,#facc15)"></div></div>
<p>${a} ${A.elo} ｜ ${b} ${B.elo}</p>

<h3>近期状态</h3><div class="row"><div>${formHTML(a)}</div><div>${formHTML(b)}</div></div>

<div class="grid"><div class="box"><h3>历史交锋</h3>${h2hHTML(a,b)}</div><div class="box"><h3>首轮/已赛回顾</h3>${firstRoundHTML(a,b)}</div></div>

<div class="box"><h3>小组积分形势（${g}组）</h3><table><tr><th>排名</th><th>球队</th><th>分</th><th>净胜</th></tr>${st.map((x,i)=>`<tr><td>${i+1}</td><td>${flag[x.team]} ${x.team}</td><td>${x.pts}</td><td>${x.gf-x.ga}</td></tr>`).join("")}</table>${st.map(x=>`<p>${x.team} 出线概率 ${qualifyProb(x.team)}%</p><div class="barbg"><div class="bar" style="width:${qualifyProb(x.team)}%"></div></div>`).join("")}</div>

<h3>AI比分预测 TOP5</h3>${p.top.map((s,i)=>`<p>${i+1}. ${s[0]}｜${s[1]}%</p><div class="barbg"><div class="bar" style="width:${s[1]*4}%"></div></div>`).join("")}

<h3>胜平负概率</h3><p>${a}胜 ${p.aw}%｜平局 ${p.dr}%｜${b}胜 ${p.bw}%</p>
<div class="barbg"><div style="height:100%;width:${p.aw}%;background:#f97316;float:left"></div><div style="height:100%;width:${p.dr}%;background:#94a3b8;float:left"></div><div style="height:100%;width:${p.bw}%;background:#facc15;float:left"></div></div>

<h3>战术分析</h3><p class="ai">${a}预计采用稳守反击/边路推进，${b}更依赖中场控球和快速转换。若${a}能限制对手前场核心，比赛会更接近平局；若${b}持续压迫，进球机会会明显增加。</p>

<h3>关键球员对决</h3><div class="grid"><div class="box">${players[a]||a+"核心球员"}<br>进球能力 ${A.atk}<br>创造机会 ${A.ctl}</div><div class="box">${players[b]||b+"核心球员"}<br>进球能力 ${B.atk}<br>创造机会 ${B.ctl}</div></div>

<h3>AI最终结论</h3><p class="ai">${p.reason}</p><p class="score">${p.aw>=p.bw?a:b} 不败</p><p>信心指数：${p.conf}%</p>
</div>`;
});
matches.innerHTML=html;
}

function simulateTournament(){let winners=[];Object.keys(groups).forEach(g=>{let arr=[...groups[g]].sort((a,b)=>strength(b)-strength(a));winners.push(arr[0],arr[1])});while(winners.length>1){let next=[];for(let i=0;i<winners.length;i+=2)next.push(pickWinner(winners[i],winners[i+1]));winners=next}return winners[0]}

function simulateMany(){let count={};allTeams().forEach(t=>count[t]=0);for(let i=0;i<10000;i++)count[simulateTournament()]++;let top=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,10);manySim.innerHTML=`<div class="match"><h3>10000次模拟冠军统计</h3>${top.map(x=>`<p>${flag[x[0]]} ${x[0]}：${x[1]}次｜${(x[1]/100).toFixed(1)}%</p><div class="barbg"><div class="bar" style="width:${x[1]/100}%"></div></div>`).join("")}</div>`}

function renderGroups(){groupTable.innerHTML=Object.keys(groups).map(g=>`<div class="match"><h3>${g}组</h3><table><tr><th>排名</th><th>球队</th><th>赛</th><th>分</th><th>净胜</th></tr>${standings(g).map((x,i)=>`<tr><td>${i+1}</td><td>${flag[x.team]} ${x.team}</td><td>${x.p}</td><td>${x.pts}</td><td>${x.gf-x.ga}</td></tr>`).join("")}</table></div>`).join("")}
function renderRanking(){let top=allTeams().sort((a,b)=>data(b).prob-data(a).prob).slice(0,20);ranking.innerHTML=top.map((t,i)=>`<p>${i+1}. ${flag[t]} ${t}｜${data(t).prob}%</p><div class="barbg"><div class="bar" style="width:${data(t).prob*3}%"></div></div>`).join("")}
function renderUpdate(){update.innerHTML="数据更新时间："+new Date().toLocaleString()+"｜实时数据当前由 liveFeed 手动维护。预测仅供分析，不构成投注建议。"}

init();
