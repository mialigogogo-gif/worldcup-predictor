<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界杯预测中心 V5</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0f172a;
  color:white;
  padding:20px;
}

h1{
  font-size:34px;
  margin-top:30px;
}

.card{
  background:#1e293b;
  padding:18px;
  border-radius:18px;
  margin-bottom:18px;
}

select,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:12px;
  font-size:16px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  font-weight:bold;
}

.result{
  margin-top:18px;
  background:#0f172a;
  padding:15px;
  border-radius:14px;
  border:1px solid #334155;
}

.big{
  font-size:28px;
  font-weight:bold;
  color:#38bdf8;
}

.small{
  color:#cbd5e1;
  font-size:14px;
}

.rank-row{
  margin:12px 0;
}

.bar-bg{
  background:#334155;
  height:12px;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.bar{
  height:12px;
  background:#38bdf8;
  border-radius:10px;
}

.ai{
  line-height:1.7;
  color:#e0f2fe;
}

.match-title{
  font-size:20px;
  font-weight:bold;
  color:#f8fafc;
}

.score{
  font-size:26px;
  color:#38bdf8;
  font-weight:bold;
}

.footer{
  color:#94a3b8;
  font-size:13px;
  margin-top:30px;
}
</style>
</head>

<body>

<h1>⚽ 世界杯预测中心 V5</h1>

<div class="card">
  <h2>冠军预测</h2>

  <select id="team">
    <option value="阿根廷">🇦🇷 阿根廷</option>
    <option value="法国">🇫🇷 法国</option>
    <option value="巴西">🇧🇷 巴西</option>
    <option value="德国">🇩🇪 德国</option>
    <option value="英格兰">🏴 英格兰</option>
    <option value="西班牙">🇪🇸 西班牙</option>
    <option value="葡萄牙">🇵🇹 葡萄牙</option>
    <option value="荷兰">🇳🇱 荷兰</option>
    <option value="比利时">🇧🇪 比利时</option>
    <option value="乌拉圭">🇺🇾 乌拉圭</option>
  </select>

  <button onclick="predict()">开始预测</button>

  <div id="result"></div>
</div>

<div class="card">
  <h2>今日比赛预测</h2>
  <div id="matches"></div>
</div>

<div class="card">
  <h2>夺冠概率排行榜</h2>
  <div id="ranking"></div>
</div>

<div class="card">
  <h2>模型说明</h2>
  <p class="small">
    V5 版本加入每日比赛预测、胜平负概率和预测比分。当前数据为示例模型数据，后续可以继续接入实时赛果、xG、Elo、FIFA排名和自动更新。
  </p>
</div>

<div class="footer">
  预测仅供分析，不构成投注建议。
</div>

<script>
let matches = [
  {
    date:"今日",
    game:"西班牙 vs 沙特",
    home:"西班牙",
    away:"沙特",
    homeWin:57,
    draw:26,
    awayWin:17,
    score:"2-0"
  },
  {
    date:"今日",
    game:"比利时 vs 伊朗",
    home:"比利时",
    away:"伊朗",
    homeWin:53,
    draw:24,
    awayWin:23,
    score:"2-1"
  },
  {
    date:"今日",
    game:"乌拉圭 vs 佛得角",
    home:"乌拉圭",
    away:"佛得角",
    homeWin:62,
    draw:22,
    awayWin:16,
    score:"2-0"
  },
  {
    date:"明日",
    game:"阿根廷 vs 奥地利",
    home:"阿根廷",
    away:"奥地利",
    homeWin:65,
    draw:17,
    awayWin:18,
    score:"2-1"
  },
  {
    date:"明日",
    game:"法国 vs 伊拉克",
    home:"法国",
    away:"伊拉克",
    homeWin:94,
    draw:4,
    awayWin:2,
    score:"4-0"
  }
];

let teams = {
  "阿根廷":{
    flag:"🇦🇷",
    prob:27,
    rank:1,
    players:["梅西","劳塔罗","恩佐","麦卡利斯特"],
    analysis:"阿根廷整体稳定性强，大赛经验丰富，中前场创造力突出。若核心球员保持健康，仍是冠军热门。"
  },
  "巴西":{
    flag:"🇧🇷",
    prob:16,
    rank:2,
    players:["维尼修斯","罗德里戈","马丁内利","卡塞米罗"],
    analysis:"巴西个人能力极强，边路爆点多，进攻上限很高。但中后场稳定性会影响淘汰赛表现。"
  },
  "法国":{
    flag:"🇫🇷",
    prob:14,
    rank:3,
    players:["姆巴佩","登贝莱","格列兹曼","楚阿梅尼"],
    analysis:"法国阵容厚度顶级，速度和冲击力极强。若中场控制稳定，具备再次冲击冠军的能力。"
  },
  "德国":{
    flag:"🇩🇪",
    prob:13,
    rank:4,
    players:["穆西亚拉","维尔茨","哈弗茨","基米希"],
    analysis:"德国技术型球员储备丰富，进攻组织能力强。如果防线稳定，淘汰赛竞争力会明显提升。"
  },
  "英格兰":{
    flag:"🏴",
    prob:12,
    rank:5,
    players:["贝林厄姆","凯恩","福登","萨卡"],
    analysis:"英格兰阵容豪华，攻防平衡度高。关键问题在于大赛淘汰赛阶段的临场调整。"
  },
  "西班牙":{
    flag:"🇪🇸",
    prob:11,
    rank:6,
    players:["佩德里","罗德里","亚马尔","奥尔莫"],
    analysis:"西班牙控球体系成熟，节奏控制能力强。面对高强度反击球队时需要提高终结效率。"
  },
  "葡萄牙":{
    flag:"🇵🇹",
    prob:10,
    rank:7,
    players:["C罗","B费","莱奥","贝尔纳多"],
    analysis:"葡萄牙阵容深度出色，前场选择丰富。若攻防转换更稳定，有机会进入四强。"
  },
  "荷兰":{
    flag:"🇳🇱",
    prob:9,
    rank:8,
    players:["范戴克","德容","加克波","德利赫特"],
    analysis:"荷兰身体对抗和防守质量较高，适合淘汰赛。但进攻端持续输出能力仍是关键。"
  },
  "比利时":{
    flag:"🇧🇪",
    prob:8,
    rank:9,
    players:["德布劳内","卢卡库","多库","奥纳纳"],
    analysis:"比利时仍有高水平核心球员，但阵容年龄结构和防守稳定性会影响上限。"
  },
  "乌拉圭":{
    flag:"🇺🇾",
    prob:7,
    rank:10,
    players:["努涅斯","巴尔韦德","阿劳霍","本坦库尔"],
    analysis:"乌拉圭身体强度高，比赛韧性强。若进攻效率提升，有爆冷进入后期阶段的可能。"
  }
};

function predict(){
  let name = document.getElementById("team").value;
  let t = teams[name];

  document.getElementById("result").innerHTML =
  `
  <div class="result">
    <div class="big">${t.flag} ${name}</div>
    <p>🏆 夺冠概率：<b>${t.prob}%</b></p>
    <p>📊 全球排名：第 <b>${t.rank}</b> 名</p>

    <div class="bar-bg">
      <div class="bar" style="width:${t.prob}%"></div>
    </div>

    <h3>核心球员</h3>
    <p>${t.players.join(" · ")}</p>

    <h3>AI 分析</h3>
    <p class="ai">${t.analysis}</p>
  </div>
  `;
}

function renderMatches(){
  let html = "";

  matches.forEach(m=>{
    html += `
    <div class="result">
      <div class="match-title">${m.date} · ${m.game}</div>
      <p>预测比分：</p>
      <div class="score">${m.score}</div>

      <p>${m.home} 胜：${m.homeWin}%</p>
      <div class="bar-bg">
        <div class="bar" style="width:${m.homeWin}%"></div>
      </div>

      <p>平局：${m.draw}%</p>
      <div class="bar-bg">
        <div class="bar" style="width:${m.draw}%"></div>
      </div>

      <p>${m.away} 胜：${m.awayWin}%</p>
      <div class="bar-bg">
        <div class="bar" style="width:${m.awayWin}%"></div>
      </div>
    </div>
    `;
  });

  document.getElementById("matches").innerHTML = html;
}

function renderRanking(){
  let ranking = Object.entries(teams)
    .sort((a,b)=>b[1].prob-a[1].prob);

  let html = "";

  ranking.forEach((item,index)=>{
    let name = item[0];
    let t = item[1];

    html += `
    <div class="rank-row">
      <div>
        ${index+1}. ${t.flag} ${name}
        <span class="small">${t.prob}%</span>
      </div>
      <div class="bar-bg">
        <div class="bar" style="width:${t.prob}%"></div>
      </div>
    </div>
    `;
  });

  document.getElementById("ranking").innerHTML = html;
}

renderMatches();
renderRanking();
</script>

</body>
</html>
