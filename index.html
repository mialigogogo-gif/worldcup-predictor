<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>世界杯预测中心 V22</title>
<style>
body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
h1{font-size:32px}
h2{margin-top:0}
.card{background:#111c2d;border:1px solid #26364d;border-radius:22px;padding:18px;margin:16px 0}
select,button{width:100%;padding:15px;border-radius:14px;font-size:17px;margin-top:10px}
button{background:#2563eb;color:#fff;border:0;font-weight:900}
.match{border:1px solid #2f405a;border-radius:22px;padding:18px;margin-top:16px;background:#081426}
.big{font-size:32px;color:#38bdf8;font-weight:900}
.score{font-size:48px;color:#facc15;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:#0f1b2d;border:1px solid #2f405a;border-radius:16px;padding:14px}
.barbg{height:14px;background:#334155;border-radius:99px;overflow:hidden;margin:8px 0}
.bar{height:100%;background:#38bdf8}
.orange{color:#fb923c}
.yellow{color:#facc15}
.muted{color:#94a3b8}
.ai{line-height:1.8;color:#dbeafe}
.center{text-align:center}
.flag{font-size:46px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;padding:7px 11px;border-radius:999px;margin:3px}
.win{background:#15803d}
.draw{background:#64748b}
.loss{background:#dc2626}
.live{background:#dc2626;color:#fff;padding:6px 12px;border-radius:999px;font-weight:900;display:inline-block}
.done{background:#334155;color:#cbd5e1;padding:6px 12px;border-radius:999px;display:inline-block}
.future{background:#1d4ed8;color:white;padding:6px 12px;border-radius:999px;display:inline-block}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #26364d;text-align:left}
.small{font-size:13px}
</style>
</head>

<h1>⚽ 世界杯预测中心 V22</h1>

<div class="card">
  <h2>冠军预测｜48队</h2>
  <select id="team"></select>
  <button onclick="predictTeam()">开始预测</button>
  <div id="teamResult"></div>
</div>

<div class="card">
  <h2>今日 / 明日 / 后日世界杯比赛</h2>

    <option value="tomorrow">明日比赛</option>
    <option value="after">后日比赛</option>
    <option value="all">全部比赛</option>
  </select>
  <button onclick="loadWorldCupGames()">刷新世界杯数据</button>
  <div id="matches"></div>
</div>

<div class="card">
  <h2>📊 10000次世界杯模拟</h2>
  <button onclick="simulateMany()">运行10000次模拟</button>
  <div id="manySim"></div>
</div>

<div class="card">
  <h2>动态小组积分榜</h2>
  <div id="groupTable"></div>
</div>

<div class="card">
  <h2>夺冠概率排行榜</h2>

</div>

<div class="muted" id="update"></div>

let apiGames = [];

function zhName(name){ return nameMap[name] || name; }
function allTeams(){return Object.values(groups).flat()}
function groupOf(t){for(let g in groups){if(groups[g].includes(t))return g}return "-"}
function data(t){let p=power[t]||[1,62,62,62,1300,99];return{prob:p[0],atk:p[1],def:p[2],ctl:p[3],elo:p[4],rank:p[5]}}
function strength(t){let x=data(t);return x.atk*.45+x.def*.35+x.ctl*.2}
function winProb(a,b){let diff=strength(a)-strength(b);return Math.max(10,Math.min(85,50+diff*1.3))}
function pickWinner(a,b){return Math.random()*100<winProb(a,b)?a:b}
function form(t){let s=Math.round(strength(t));return s>82?["W","W","D","W","L"]:s>75?["W","D","W","L","W"]:s>68?["D","W","L","D","W"]:["L","D","L","W","D"]}
function formHTML(t){return form(t).map(x=>`<span class="pill ${x=="W"?"win":x=="D"?"draw":"loss"}">${x}</span>`).join("")}

function predictMatch(a,b){
let A=data(a),B=data(b);
let aw=Math.round(winProb(a,b)),bw=Math.round(100-aw-26),dr=100-aw-bw;if(bw<8){bw=8;dr=100-aw-bw}
let pa=Math.max(38,Math.min(68,Math.round(50+(A.ctl-B.ctl)*.8))),pb=100-pa;
let xga=Math.max(.3,(A.atk*.04+A.ctl*.01-B.def*.025)).toFixed(2),xgb=Math.max(.3,(B.atk*.04+B.ctl*.01-A.def*.025)).toFixed(2);
let sa=Math.round(Number(xga)*5+4),sb=Math.round(Number(xgb)*5+4),oa=Math.max(1,Math.round(sa*.38)),ob=Math.max(1,Math.round(sb*.38));
let ca=Math.max(1,Math.round(pa/13+Number(xga))),cb=Math.max(1,Math.round(pb/13+Number(xgb)));
let ga=Math.max(0,Math.round(Number(xga))),gb=Math.max(0,Math.round(Number(xgb)));
if(aw>60&&ga<=gb)ga=gb+1;if(bw>55&&gb<=ga)gb=ga+1;
let top=[[ga+"-"+gb,22],[Math.max(0,ga+1)+"-"+gb,18],[ga+"-"+Math.max(0,gb-1),15],[Math.max(0,ga-1)+"-"+gb,12],[ga+"-"+(gb+1),10]];
let reason=`${a}综合强度${Math.round(strength(a))}，${b}综合强度${Math.round(strength(b))}。${A.ctl>B.ctl?a+"控球更强，预计掌握更多球权。":b+"控球更强，"+a+"可能更多依靠反击。"}模型倾向：${aw>=bw?a:b}不败。`;
return{aw,bw,dr,score:ga+"-"+gb,pa,pb,xga,xgb,sa,sb,oa,ob,ca,cb,top,reason,conf:Math.max(aw,bw,dr)}
}

function normalizeDate(str){
  if(!str) return "";
  const parts = String(str).split(" ")[0].split("/");
  if(parts.length !== 3) return "";
  const mm = parts[0].padStart(2,"0");
  const dd = parts[1].padStart(2,"0");
  const yyyy = parts[2];
  return `${yyyy}-${mm}-${dd}`;
}

function getTargetDate(mode){
  const today = new Date();
  const d = new Date(today);
  if(mode === "tomorrow") d.setDate(d.getDate()+1);
  if(mode === "after") d.setDate(d.getDate()+2);
  return d.toISOString().slice(0,10);
}

async function loadWorldCupGames(){
  matches.innerHTML = "<p class='muted'>正在读取世界杯比赛数据...</p>";
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    apiGames = data.games || [];
    renderMatches();
    update.innerHTML = "数据更新时间：" + new Date().toLocaleString() + "｜数据来源：worldcup26.ir";
  }catch(e){
    matches.innerHTML = "<p class='muted'>读取失败：" + e.message + "</p>";
  }
}

function statusBadge(game){
  const finished = String(game.finished).toUpperCase() === "TRUE";
  const elapsed = String(game.time_elapsed || "").toLowerCase();
  if(finished) return `<span class="done">已完赛</span>`;
  if(elapsed && elapsed !== "not_started" && elapsed !== "scheduled") return `<span class="live">🔴 LIVE ${game.time_elapsed}</span>`;
  return `<span class="future">未开始</span>`;
}

function renderMatches(){
  const mode = document.getElementById("mode").value;
  let games = [...apiGames];

  if(mode !== "all"){
    const target = getTargetDate(mode);
    games = games.filter(g => normalizeDate(g.local_date) === target);
  }

  if(!games.length){
    matches.innerHTML = "<p class='muted'>该日期暂无世界杯比赛。</p>";
    return;
  }

  let html = "";
  games.forEach(g=>{
    const home = zhName(g.home_team_name_en);
    const away = zhName(g.away_team_name_en);
    const group = g.group ? `${g.group}组` : "淘汰赛";
    const round = `第${g.matchday || "-"}轮`;
    const status = statusBadge(g);
    const score = `${g.home_score ?? "-"}-${g.away_score ?? "-"}`;
    const p = predictMatch(home, away);
    const localDate = g.local_date || "";
    const stadium = g.stadium_id ? `球场ID ${g.stadium_id}` : "球场待定";

    html += `
    <div class="match">
      <div class="center">
        <p>${status}</p>
        <p class="muted">${group}｜${round}</p>
        <div class="row">
          <div>
            <div class="flag">${flag[home] || "⚽"}</div>
            <h2 class="orange">${home}</h2>
          </div>
          <div>
            <h1>VS</h1>
            <p>${localDate}</p>
            <p>${stadium}</p>
          </div>
          <div>
            <div class="flag">${flag[away] || "⚽"}</div>
            <h2 class="yellow">${away}</h2>
          </div>
        </div>
        <div class="score">${score}</div>
      </div>

      <h3>AI比赛预测</h3>
      <div class="grid">
        <div class="box">${home}<br>控球 ${p.pa}%<br>xG ${p.xga}<br>射门 ${p.sa}<br>射正 ${p.oa}<br>角球 ${p.ca}</div>
        <div class="box">${away}<br>控球 ${p.pb}%<br>xG ${p.xgb}<br>射门 ${p.sb}<br>射正 ${p.ob}<br>角球 ${p.cb}</div>
      </div>

      <h3>AI比分预测 TOP5</h3>
      ${p.top.map((s,i)=>`<p>${i+1}. ${s[0]}｜${s[1]}%</p><div class="barbg"><div class="bar" style="width:${s[1]*4}%"></div></div>`).join("")}

      <h3>胜平负概率</h3>
      <p>${home}胜 ${p.aw}%｜平局 ${p.dr}%｜${away}胜 ${p.bw}%</p>
      <div class="barbg">
        <div style="height:100%;width:${p.aw}%;background:#f97316;float:left"></div>
        <div style="height:100%;width:${p.dr}%;background:#94a3b8;float:left"></div>
        <div style="height:100%;width:${p.bw}%;background:#facc15;float:left"></div>
      </div>

      <h3>AI最终结论</h3>
      <p class="ai">${p.reason}</p>
      <p class="score">${p.aw>=p.bw?home:away} 不败</p>
      <p>信心指数：${p.conf}%</p>
    </div>`;
  });

  matches.innerHTML = html;
}

function predictTeam(){
  let t=team.value,x=data(t);
  teamResult.innerHTML=`<div class="match"><div class="flag">${flag[t]}</div><div class="big">${t}</div><p>${groupOf(t)}组｜夺冠概率 ${x.prob}%｜FIFA积分 ${x.elo}</p><div class="barbg"><div class="bar" style="width:${x.prob*3}%"></div></div><div class="grid"><div class="box">进攻 ${x.atk}</div><div class="box">防守 ${x.def}</div><div class="box">控球 ${x.ctl}</div><div class="box">综合 ${Math.round(strength(t))}</div></div><h3>核心球员</h3><p>${players[t]||"暂无详细核心球员数据"}</p></div>`;
}

function simulateTournament(){
  let winners=[];
  Object.keys(groups).forEach(g=>{
    let arr=[...groups[g]].sort((a,b)=>strength(b)-strength(a));
    winners.push(arr[0],arr[1]);
  });
  while(winners.length>1){
    let next=[];
    for(let i=0;i<winners.length;i+=2) next.push(pickWinner(winners[i],winners[i+1]));
    winners=next;
  }
  return winners[0];
}

function simulateMany(){
  let count={};allTeams().forEach(t=>count[t]=0);
  for(let i=0;i<10000;i++) count[simulateTournament()]++;
  let top=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,10);
  manySim.innerHTML=`<div class="match"><h3>10000次模拟冠军统计</h3>${top.map(x=>`<p>${flag[x[0]]} ${x[0]}：${x[1]}次｜${(x[1]/100).toFixed(1)}%</p><div class="barbg"><div class="bar" style="width:${x[1]/100}%"></div></div>`).join("")}</div>`;
}

function calcResultsFromApi(){
  const arr = [];
  apiGames.forEach(g=>{
    if(String(g.finished).toUpperCase() === "TRUE"){
      const home = zhName(g.home_team_name_en);
      const away = zhName(g.away_team_name_en);
      arr.push([home, away, `${g.home_score}-${g.away_score}`]);
    }
  });
  return arr;
}

function standings(g){
  let table={};groups[g].forEach(t=>table[t]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  calcResultsFromApi().forEach(r=>{
    let [a,b,s]=r;if(groupOf(a)!==g||groupOf(b)!==g)return;
    let [ga,gb]=s.split("-").map(Number);
    table[a].p++;table[b].p++;table[a].gf+=ga;table[a].ga+=gb;table[b].gf+=gb;table[b].ga+=ga;
    if(ga>gb){table[a].w++;table[b].l++;table[a].pts+=3}else if(ga<gb){table[b].w++;table[a].l++;table[b].pts+=3}else{table[a].d++;table[b].d++;table[a].pts++;table[b].pts++}
  });
  return Object.values(table).sort((x,y)=>y.pts-x.pts||((y.gf-y.ga)-(x.gf-x.ga))||y.gf-x.gf);
}

function renderGroups(){
  groupTable.innerHTML = Object.keys(groups).map(g=>`<div class="match"><h3>${g}组</h3><table><tr><th>排名</th><th>球队</th><th>赛</th><th>分</th><th>净胜</th></tr>${standings(g).map((x,i)=>`<tr><td>${i+1}</td><td>${flag[x.team]} ${x.team}</td><td>${x.p}</td><td>${x.pts}</td><td>${x.gf-x.ga}</td></tr>`).join("")}</table></div>`).join("");
}

function renderRanking(){
  let top=allTeams().sort((a,b)=>data(b).prob-data(a).prob).slice(0,20);
  ranking.innerHTML=top.map((t,i)=>`<p>${i+1}. ${flag[t]} ${t}｜${data(t).prob}%</p><div class="barbg"><div class="bar" style="width:${data(t).prob*3}%"></div></div>`).join("");
}

async function init(){
  team.innerHTML=allTeams().map(t=>`<option value="${t}">${flag[t]} ${t}｜${groupOf(t)}组</option>`).join("");
  predictTeam();
  renderRanking();
  await loadWorldCupGames();
  renderGroups();
}

init();
</script>
