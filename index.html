<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<style>
body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
h1{font-size:30px}h2{margin-top:0}.card{background:#111c2d;border:1px solid #26364d;border-radius:18px;padding:16px;margin:14px 0}
select,button{width:100%;padding:14px;border-radius:12px;font-size:16px;margin-top:10px}
button{background:#1d4ed8;color:white;border:0;font-weight:700}.match{border:1px solid #2f405a;border-radius:18px;padding:16px;margin-top:16px;background:#081426}
.big{font-size:26px;color:#38bdf8;font-weight:800}.score{font-size:36px;color:#facc15;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#0f1b2d;border:1px solid #2f405a;border-radius:12px;padding:10px}
.barbg{height:12px;background:#334155;border-radius:99px;overflow:hidden;margin:8px 0}.bar{height:100%;background:#38bdf8}
.orange{color:#fb923c}.yellow{color:#facc15}.muted{color:#94a3b8}.ai{line-height:1.7;color:#dbeafe}.center{text-align:center}.flag{font-size:42px}
.pill{display:inline-block;padding:6px 10px;border-radius:999px;margin:3px;background:#334155}.win{background:#15803d}.draw{background:#64748b}.loss{background:#dc2626}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>

<body>

<h1>⚽ 世界杯预测中心 V17</h1>

<div class="card">
<h2>冠军预测｜48队</h2>
<select id="team"></select>

<div id="teamResult"></div>
</div>

<div class="card">
<h2>每日比赛预测｜今日 / 明日 / 后日</h2>
<select id="matchDate" onchange="renderMatches()"></select>
<div id="matches"></div>
</div>

<div class="card">
<h2>📊 1000次世界杯模拟</h2>
<button onclick="simulateMany()">运行1000次模拟</button>
<div id="manySim"></div>
</div>

<div class="card">
<h2>小组积分榜</h2>
<div id="groupTable"></div>
</div>

<div class="card">
<h2>夺冠概率排行榜</h2>
<div id="ranking"></div>
</div>

<div class="muted" id="update"></div>

<script>
const groups={

const flag={"墨西哥":"🇲🇽","南非":"🇿🇦","韩国":"🇰🇷","捷克":"🇨🇿","加拿大":"🇨🇦","波黑":"🇧🇦","卡塔尔":"🇶🇦","瑞士":"🇨🇭","巴西":"🇧🇷","摩洛哥":"🇲🇦","海地":"🇭🇹","苏格兰":"🏴","美国":"🇺🇸","巴拉圭":"🇵🇾","澳大利亚":"🇦🇺","土耳其":"🇹🇷","德国":"🇩🇪","库拉索":"🇨🇼","科特迪瓦":"🇨🇮","厄瓜多尔":"🇪🇨","荷兰":"🇳🇱","日本":"🇯🇵","瑞典":"🇸🇪","突尼斯":"🇹🇳","比利时":"🇧🇪","埃及":"🇪🇬","伊朗":"🇮🇷","新西兰":"🇳🇿","西班牙":"🇪🇸","佛得角":"🇨🇻","沙特":"🇸🇦","乌拉圭":"🇺🇾","法国":"🇫🇷","塞内加尔":"🇸🇳","伊拉克":"🇮🇶","挪威":"🇳🇴","阿根廷":"🇦🇷","阿尔及利亚":"🇩🇿","奥地利":"🇦🇹","约旦":"🇯🇴","葡萄牙":"🇵🇹","刚果（金）":"🇨🇩","乌兹别克斯坦":"🇺🇿","哥伦比亚":"🇨🇴","英格兰":"🏴","克罗地亚":"🇭🇷","加纳":"🇬🇭","巴拿马":"🇵🇦"};

const power={
"阿根廷":[27,92,88,90,1998,1],"巴西":[16,91,82,84,1940,3],"法国":[14,90,86,83,1965,2],"德国":[13,87,82,86,1870,9],
"英格兰":[12,88,85,84,1885,5],"西班牙":[11,84,83,92,1860,4],"葡萄牙":[10,86,81,82,1840,6],"荷兰":[9,82,87,80,1992,8],
"比利时":[8,84,76,80,1790,10],"乌拉圭":[7,81,84,76,1765,13],"日本":[5,78,75,80,1710,15],"哥伦比亚":[5,79,75,76,1740,12],
"美国":[4,76,74,73,1690,16],"加拿大":[4,76,72,70,1650,21],"瑞士":[4,74,76,72,1688,18],"奥地利":[4,76,77,74,1689,18],
"塞内加尔":[4,75,79,70,1695,17],"克罗地亚":[4,74,76,80,1735,12],"摩洛哥":[4,74,78,71,1700,16],"墨西哥":[4,75,73,72,1698,14],
"挪威":[4,80,72,69,1680,19],"土耳其":[3,74,70,72,1640,23],"韩国":[3,72,70,73,1635,22],"瑞典":[3,71,72,68,1620,24],
"厄瓜多尔":[3,76,78,72,1660,20],"埃及":[2,73,70,68,1580,25],"伊朗":[2,70,72,66,1590,28],"加纳":[2,68,66,64,1510,35],
"巴拉圭":[2,68,73,64,1525,32],"澳大利亚":[2,68,71,65,1540,29],"阿尔及利亚":[2,72,70,68,1530,30],"捷克":[2,68,70,66,1515,33],
"苏格兰":[2,66,70,67,1505,34],"科特迪瓦":[2,70,70,66,1530,30],"沙特":[1,68,66,64,1450,31],"突尼斯":[1,65,70,62,1460,37],
"新西兰":[1,61,63,58,1400,43],"佛得角":[1,64,65,60,1430,40],"伊拉克":[1,62,64,60,1410,42],"约旦":[1,60,62,58,1380,46],
"乌兹别克斯坦":[1,64,66,62,1440,39],"刚果（金）":[1,62,64,60,1360,52],"巴拿马":[1,60,61,58,1370,47],"南非":[1,63,64,62,1390,45],
"波黑":[1,65,62,64,1395,44],"卡塔尔":[1,60,58,60,1350,50],"海地":[1,58,58,55,1320,60],"库拉索":[1,58,60,55,1365,48]
};

const players={"阿根廷":"梅西 · 劳塔罗 · 恩佐","巴西":"维尼修斯 · 罗德里戈","法国":"姆巴佩 · 登贝莱","英格兰":"贝林厄姆 · 凯恩","日本":"久保建英 · 三笘薰","葡萄牙":"C罗 · B费","荷兰":"范戴克 · 德容","瑞典":"伊萨克 · 库卢塞夫斯基","西班牙":"佩德里 · 罗德里 · 亚马尔"};

const schedule=[
["2026-06-21","01:00","F组 第2轮","荷兰","瑞典","已完赛","5-1","大都会球场"],
["2026-06-21","04:00","E组 第2轮","德国","科特迪瓦","已完赛","2-1","多伦多球场"],
["2026-06-21","08:00","E组 第2轮","厄瓜多尔","库拉索","已完赛","0-0","休斯敦球场"],
["2026-06-21","12:00","F组 第2轮","突尼斯","日本","进行中","0-2","洛杉矶球场"],
["2026-06-22","00:00","H组 第2轮","西班牙","沙特","未开始","","洛杉矶球场"],
["2026-06-22","03:00","G组 第2轮","比利时","伊朗","未开始","","纽约球场"],
["2026-06-22","06:00","H组 第2轮","乌拉圭","佛得角","未开始","","迈阿密球场"],
["2026-06-22","09:00","G组 第2轮","新西兰","埃及","未开始","","达拉斯球场"],
["2026-06-23","01:00","J组 第2轮","阿根廷","奥地利","未开始","","亚特兰大球场"],
["2026-06-23","05:00","I组 第2轮","法国","伊拉克","未开始","","波士顿球场"],
["2026-06-23","08:00","I组 第2轮","挪威","塞内加尔","未开始","","温哥华球场"],
["2026-06-23","11:00","J组 第2轮","约旦","阿尔及利亚","未开始","","多伦多球场"],
["2026-06-24","01:00","K组 第2轮","葡萄牙","乌兹别克斯坦","未开始","","休斯敦球场"],
["2026-06-24","04:00","L组 第2轮","英格兰","加纳","未开始","","堪萨斯城球场"],
["2026-06-24","07:00","L组 第2轮","巴拿马","克罗地亚","未开始","","西雅图球场"],
["2026-06-24","10:00","K组 第2轮","哥伦比亚","刚果（金）","未开始","","迈阿密球场"]
];

const firstRound={
"荷兰":"2-2 日本","日本":"2-2 荷兰","瑞典":"5-1 突尼斯","突尼斯":"1-5 瑞典",
"德国":"7-1 库拉索","库拉索":"1-7 德国","科特迪瓦":"1-0 厄瓜多尔","厄瓜多尔":"0-1 科特迪瓦",
"西班牙":"0-0 佛得角","沙特":"1-1 乌拉圭","乌拉圭":"1-1 沙特","佛得角":"0-0 西班牙",
"比利时":"1-1 埃及","埃及":"1-1 比利时","伊朗":"2-2 新西兰","新西兰":"2-2 伊朗",
"阿根廷":"3-0 阿尔及利亚","奥地利":"3-1 约旦","法国":"3-1 塞内加尔","伊拉克":"1-4 挪威"
};

function allTeams(){return Object.values(groups).flat()}
function groupOf(t){for(let g in groups){if(groups[g].includes(t))return g}return "-"}
function data(t){let p=power[t]||[1,62,62,62,1300,99];return{prob:p[0],atk:p[1],def:p[2],ctl:p[3],elo:p[4],rank:p[5]}}
function strength(t){let x=data(t);return x.atk*.45+x.def*.35+x.ctl*.2}
function winProb(a,b){let diff=strength(a)-strength(b);return Math.max(10,Math.min(85,50+diff*1.3))}
function pickWinner(a,b){return Math.random()*100<winProb(a,b)?a:b}
function form(t){let s=Math.round(strength(t));return s>82?["W","W","D","W","L"]:s>75?["W","D","W","L","W"]:s>68?["D","W","L","D","W"]:["L","D","L","W","D"]}
function formHTML(t){return form(t).map(x=>`<span class="pill ${x=="W"?"win":x=="D"?"draw":"loss"}">${x}</span>`).join("")}

function predictMatch(a,b){
let A=data(a),B=data(b);
let aw=Math.round(winProb(a,b)),bw=Math.round(100-aw-26),dr=100-aw-bw;if(bw<8){bw=8;dr=100-aw-bw}
let pa=Math.max(38,Math.min(68,Math.round(50+(A.ctl-B.ctl)*.8))),pb=100-pa;
let xga=Math.max(.3,(A.atk*.04+A.ctl*.01-B.def*.025)).toFixed(2),xgb=Math.max(.3,(B.atk*.04+B.ctl*.01-A.def*.025)).toFixed(2);
let sa=Math.round(Number(xga)*5+4),sb=Math.round(Number(xgb)*5+4),oa=Math.max(1,Math.round(sa*.38)),ob=Math.max(1,Math.round(sb*.38));
let ca=Math.max(1,Math.round(pa/13+Number(xga))),cb=Math.max(1,Math.round(pb/13+Number(xgb)));
let ga=Math.max(0,Math.round(Number(xga))),gb=Math.max(0,Math.round(Number(xgb)));
if(aw>60&&ga<=gb)ga=gb+1;if(bw>55&&gb<=ga)gb=ga+1;
let top=[[ga+"-"+gb,11],[Math.max(0,ga+1)+"-"+gb,10],[ga+"-"+Math.max(0,gb-1),9],[Math.max(0,ga-1)+"-"+gb,8],[ga+"-"+(gb+1),6]];
let reason=`${a}综合强度${Math.round(strength(a))}，${b}综合强度${Math.round(strength(b))}。${A.ctl>B.ctl?a+"控球能力更强，预计掌握更多球权。":b+"控球更强，"+a+"可能更多依靠反击。"}模型倾向：${aw>=bw?a:b}不败。`;
return{aw,bw,dr,score:ga+"-"+gb,pa,pb,xga,xgb,sa,sb,oa,ob,ca,cb,top,reason,conf:Math.max(aw,bw,dr)}
}

function init(){
document.getElementById("team").innerHTML=allTeams().map(t=>`<option value="${t}">${flag[t]} ${t}｜${groupOf(t)}组</option>`).join("");
let dates=[...new Set(schedule.map(x=>x[0]))];
document.getElementById("matchDate").innerHTML=dates.map(d=>`<option value="${d}">${d}</option>`).join("");
predictTeam();renderMatches();renderGroups();renderRanking();renderUpdate();
}

function predictTeam(){
let t=document.getElementById("team").value,x=data(t);
document.getElementById("teamResult").innerHTML=`<div class="match"><div class="flag">${flag[t]}</div><div class="big">${t}</div><p>${groupOf(t)}组｜夺冠概率 ${x.prob}%｜FIFA积分 ${x.elo}</p><div class="barbg"><div class="bar" style="width:${x.prob*3}%"></div></div><div class="grid"><div class="box">进攻 ${x.atk}</div><div class="box">防守 ${x.def}</div><div class="box">控球 ${x.ctl}</div><div class="box">综合 ${Math.round(strength(t))}</div></div><h3>核心球员</h3><p>${players[t]||"暂无详细核心球员数据"}</p></div>`;
}

function renderMatches(){
let date=document.getElementById("matchDate").value,html="";
schedule.filter(m=>m[0]===date).forEach(m=>{
let [d,time,stage,a,b,status,realScore,stadium]=m,p=predictMatch(a,b),A=data(a),B=data(b),g=groupOf(a);
html+=`<div class="match"><div class="center"><p class="muted">${stage}｜${status}</p><div class="row"><div><div class="flag">${flag[a]}</div><h2 class="orange">${a}</h2><p>FIFA积分 ${A.elo}</p></div><div><h1>VS</h1><p>${d} ${time}</p><p>${stadium}</p></div><div><div class="flag">${flag[b]}</div><h2 class="yellow">${b}</h2><p>FIFA积分 ${B.elo}</p></div></div>${realScore?`<div class="score">${realScore}</div>`:`<div class="score">${p.score}</div>`}</div>

<h3>近期状态</h3><div class="row"><div>${formHTML(a)}</div><div>${formHTML(b)}</div></div>

<div class="grid"><div class="box"><h3>历史交锋</h3><p>近5次：${a} 2胜｜平2｜${b} 1胜</p><p>样本不足时按同级别友谊赛/洲际赛估算。</p></div><div class="box"><h3>首轮回顾</h3><p>${a}：${firstRound[a]||"暂无首轮记录"}</p><p>${b}：${firstRound[b]||"暂无首轮记录"}</p></div></div>

<div class="box"><h3>小组积分形势（${g}组）</h3>${groups[g].map((t,i)=>`<p>${i+1}. ${flag[t]} ${t}｜出线概率 ${qualifyProb(t)}%</p><div class="barbg"><div class="bar" style="width:${qualifyProb(t)}%"></div></div>`).join("")}</div>

<h3>对比数据预测</h3><div class="grid"><div class="box">${a}<br>控球 ${p.pa}%<br>xG ${p.xga}<br>射门 ${p.sa}<br>射正 ${p.oa}<br>角球 ${p.ca}</div><div class="box">${b}<br>控球 ${p.pb}%<br>xG ${p.xgb}<br>射门 ${p.sb}<br>射正 ${p.ob}<br>角球 ${p.cb}</div></div>

<h3>AI比分预测 TOP5</h3>${p.top.map((s,i)=>`<p>${i+1}. ${s[0]}｜${s[1]}%</p><div class="barbg"><div class="bar" style="width:${s[1]*5}%"></div></div>`).join("")}

<h3>胜平负概率</h3><p>${a}胜 ${p.aw}%｜平局 ${p.dr}%｜${b}胜 ${p.bw}%</p><div class="barbg"><div style="height:100%;width:${p.aw}%;background:#f97316;float:left"></div><div style="height:100%;width:${p.dr}%;background:#94a3b8;float:left"></div><div style="height:100%;width:${p.bw}%;background:#facc15;float:left"></div></div>

<h3>关键球员对决</h3><div class="grid"><div class="box">${players[a]||a+"核心球员"}<br>进球能力 ${A.atk}<br>创造机会 ${A.ctl}</div><div class="box">${players[b]||b+"核心球员"}<br>进球能力 ${B.atk}<br>创造机会 ${B.ctl}</div></div>

<h3>AI最终结论</h3><p class="ai">${p.reason}</p><p class="score">${p.aw>=p.bw?a:b} 不败</p><p>信心指数：${p.conf}%</p></div>`;
});
document.getElementById("matches").innerHTML=html;
}

function qualifyProb(t){return Math.max(8,Math.min(92,Math.round(strength(t)-5)))}

function simulateTournament(){let winners=[];Object.keys(groups).forEach(g=>{let arr=[...groups[g]].sort((a,b)=>strength(b)-strength(a));winners.push(arr[0],arr[1])});while(winners.length>1){let next=[];for(let i=0;i<winners.length;i+=2)next.push(pickWinner(winners[i],winners[i+1]));winners=next}return winners[0]}
function simulateMany(){let count={};allTeams().forEach(t=>count[t]=0);for(let i=0;i<1000;i++)count[simulateTournament()]++;let top=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,10);document.getElementById("manySim").innerHTML=`<div class="match"><h3>1000次模拟冠军统计</h3>${top.map(x=>`<p>${flag[x[0]]} ${x[0]}：${x[1]}次｜${(x[1]/10).toFixed(1)}%</p><div class="barbg"><div class="bar" style="width:${x[1]/10}%"></div></div>`).join("")}</div>`}
function renderGroups(){document.getElementById("groupTable").innerHTML=Object.keys(groups).map(g=>`<div class="match"><h3>${g}组</h3>${groups[g].map((t,i)=>`<p>${i+1}. ${flag[t]} ${t}｜强度 ${Math.round(strength(t))}｜出线 ${qualifyProb(t)}%</p>`).join("")}</div>`).join("")}
function renderRanking(){let top=allTeams().sort((a,b)=>data(b).prob-data(a).prob).slice(0,20);document.getElementById("ranking").innerHTML=top.map((t,i)=>`<p>${i+1}. ${flag[t]} ${t}｜${data(t).prob}%</p><div class="barbg"><div class="bar" style="width:${data(t).prob*3}%"></div></div>`).join("")}
function renderUpdate(){document.getElementById("update").innerHTML="数据更新时间："+new Date().toLocaleString()+"｜预测仅供分析，不构成投注建议。"}

init();
</script>
</body>
</html>
