<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界杯预测中心 V20</title>
<style>
body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
h1{font-size:32px}h2{margin-top:0}.card{background:#111c2d;border:1px solid #26364d;border-radius:20px;padding:16px;margin:14px 0}
select,button{width:100%;padding:14px;border-radius:12px;font-size:16px;margin-top:10px}
button{background:#2563eb;color:white;border:0;font-weight:800}.match{border:1px solid #2f405a;border-radius:20px;padding:18px;margin-top:16px;background:#081426}
.big{font-size:28px;color:#38bdf8;font-weight:900}.score{font-size:46px;color:#facc15;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#0f1b2d;border:1px solid #2f405a;border-radius:14px;padding:12px}
.barbg{height:14px;background:#334155;border-radius:99px;overflow:hidden;margin:8px 0}.bar{height:100%;background:#38bdf8}
.orange{color:#fb923c}.yellow{color:#facc15}.muted{color:#94a3b8}.ai{line-height:1.7;color:#dbeafe}.center{text-align:center}.flag{font-size:44px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{display:inline-block;padding:7px 11px;border-radius:999px;margin:3px}
.win{background:#15803d}.draw{background:#64748b}.loss{background:#dc2626}.live{background:#dc2626;color:#fff;padding:6px 12px;border-radius:999px;font-weight:900;display:inline-block}
.done{background:#334155;color:#cbd5e1;padding:6px 12px;border-radius:999px;display:inline-block}.future{background:#1d4ed8;color:white;padding:6px 12px;border-radius:999px;display:inline-block}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #26364d;text-align:left}
.logo{width:54px;height:54px;object-fit:contain}.small{font-size:13px}
</style>
</head>

<body>

<h1>⚽ 世界杯预测中心 V20</h1>

<div class="card">
<h2>冠军预测｜48队</h2>
<select id="team"></select>
<button onclick="predictTeam()">开始预测</button>
<div id="teamResult"></div>
</div>

<div class="card">
<h2>今日 / 明日 / 后日比赛预测</h2>
<select id="mode" onchange="loadRealMatches()">
<option value="today">今日比赛</option>
<option value="tomorrow">明日比赛</option>
<option value="live">实时进行中</option>
</select>
<button onclick="loadRealMatches()">刷新实时数据</button>
<div id="matches"></div>
</div>

<div class="card">
<h2>📊 10000次世界杯模拟</h2>
<button onclick="simulateMany()">运行10000次模拟</button>
<div id="manySim"></div>
</div>

<div class="card">
<h2>夺冠概率排行榜</h2>
<div id="ranking"></div>
</div>

<div class="muted" id="update"></div>

<script>
const WORKER_URL = "https://worldcup-v20-api.mialigogogo.workers.dev";

const groups={
A:["墨西哥","南非","韩国","捷克"],
B:["加拿大","波黑","卡塔尔","瑞士"],
C:["巴西","摩洛哥","海地","苏格兰"],
D:["美国","巴拉圭","澳大利亚","土耳其"],
E:["德国","库拉索","科特迪瓦","厄瓜多尔"],
F:["荷兰","日本","瑞典","突尼斯"],
G:["比利时","埃及","伊朗","新西兰"],
H:["西班牙","佛得角","沙特","乌拉圭"],
I:["法国","塞内加尔","伊拉克","挪威"],
J:["阿根廷","阿尔及利亚","奥地利","约旦"],
K:["葡萄牙","刚果（金）","乌兹别克斯坦","哥伦比亚"],
L:["英格兰","克罗地亚","加纳","巴拿马"]
};

const flag={"墨西哥":"🇲🇽","南非":"🇿🇦","韩国":"🇰🇷","捷克":"🇨🇿","加拿大":"🇨🇦","波黑":"🇧🇦","卡塔尔":"🇶🇦","瑞士":"🇨🇭","巴西":"🇧🇷","摩洛哥":"🇲🇦","海地":"🇭🇹","苏格兰":"🏴","美国":"🇺🇸","巴拉圭":"🇵🇾","澳大利亚":"🇦🇺","土耳其":"🇹🇷","德国":"🇩🇪","库拉索":"🇨🇼","科特迪瓦":"🇨🇮","厄瓜多尔":"🇪🇨","荷兰":"🇳🇱","日本":"🇯🇵","瑞典":"🇸🇪","突尼斯":"🇹🇳","比利时":"🇧🇪","埃及":"🇪🇬","伊朗":"🇮🇷","新西兰":"🇳🇿","西班牙":"🇪🇸","佛得角":"🇨🇻","沙特":"🇸🇦","乌拉圭":"🇺🇾","法国":"🇫🇷","塞内加尔":"🇸🇳","伊拉克":"🇮🇶","挪威":"🇳🇴","阿根廷":"🇦🇷","阿尔及利亚":"🇩🇿","奥地利":"🇦🇹","约旦":"🇯🇴","葡萄牙":"🇵🇹","刚果（金）":"🇨🇩","乌兹别克斯坦":"🇺🇿","哥伦比亚":"🇨🇴","英格兰":"🏴","克罗地亚":"🇭🇷","加纳":"🇬🇭","巴拿马":"🇵🇦"};

const power={
"阿根廷":[27,92,88,90,1998,1],"巴西":[16,91,82,84,1940,3],"法国":[14,90,86,83,1965,2],"德国":[13,87,82,86,1870,9],
"英格兰":[12,88,85,84,1885,5],"西班牙":[11,84,83,92,1860,4],"葡萄牙":[10,86,81,82,1840,6],"荷兰":[9,82,87,80,1992,8],
"比利时":[8,84,76,80,1790,10],"乌拉圭":[7,81,84,76,1765,13],"日本":[5,78,75,80,1710,15],"哥伦比亚":[5,79,75,76,1740,12],
"美国":[4,76,74,73,1690,16],"加拿大":[4,76,72,70,1650,21],"瑞士":[4,74,76,72,1688,18],"奥地利":[4,76,77,74,1689,18],
"塞内加尔":[4,75,79,70,1695,17],"克罗地亚":[4,74,76,80,1735,12],"摩洛哥":[4,74,78,71,1700,16],"墨西哥":[4,75,73,72,1698,14],
"挪威":[4,80,72,69,1680,19],"土耳其":[3,74,70,72,1640,23],"韩国":[3,72,70,73,1635,22],"瑞典":[3,71,72,68,1620,24],
"厄瓜多尔":[3,76,78,72,1660,20],"埃及":[2,73,70,68,1580,25],"伊朗":[2,70,72,66,1590,28],"加纳":[2,68,66,64,1510,35],
"巴拉圭":[2,68,73,64,1525,32],"澳大利亚":[2,68,71,65,1540,29],"阿尔及利亚":[2,72,70,68,1530,30],"捷克":[2,68,70,66,1515,33],
"苏格兰":[2,66,70,67,1505,34],"科特迪瓦":[2,70,70,66,1530,30],"沙特":[1,68,66,64,1450,31],"突尼斯":[1,65,70,62,1460,37],
"新西兰":[1,61,63,58,1400,43],"佛得角":[1,64,65,60,1430,40],"伊拉克":[1,62,64,60,1410,42],"约旦":[1,60,62,58,1380,46],
"乌兹别克斯坦":[1,64,66,62,1440,39],"刚果（金）":[1,62,64,60,1360,52],"巴拿马":[1,60,61,58,1370,47],"南非":[1,63,64,62,1390,45],
"波黑":[1,65,62,64,1395,44],"卡塔尔":[1,60,58,60,1350,50],"海地":[1,58,58,55,1320,60],"库拉索":[1,58,60,55,1365,48]
};

const players={"阿根廷":"梅西 · 劳塔罗 · 恩佐","巴西":"维尼修斯 · 罗德里戈","法国":"姆巴佩 · 登贝莱","英格兰":"贝林厄姆 · 凯恩","日本":"久保建英 · 三笘薰","葡萄牙":"C罗 · B费","荷兰":"范戴克 · 德容","瑞典":"伊萨克 · 库卢塞夫斯基","西班牙":"佩德里 · 罗德里 · 亚马尔"};

function allTeams(){return Object.values(groups).flat()}
function groupOf(t){for(let g in groups){if(groups[g].includes(t))return g}return "-"}
function data(t){let p=power[t]||[2,68,68,68,1500,50];return{prob:p[0],atk:p[1],def:p[2],ctl:p[3],elo:p[4],rank:p[5]}}
function strength(t){let x=data(t);return x.atk*.45+x.def*.35+x.ctl*.2}
function winProb(a,b){let diff=strength(a)-strength(b);return Math.max(10,Math.min(85,50+diff*1.3))}
function pickWinner(a,b){return Math.random()*100<winProb(a,b)?a:b}
function form(t){let s=Math.round(strength(t));return s>82?["W","W","D","W","L"]:s>75?["W","D","W","L","W"]:s>68?["D","W","L","D","W"]:["L","D","L","W","D"]}
function formHTML(t){return form(t).map(x=>`<span class="pill ${x=="W"?"win":x=="D"?"draw":"loss"}">${x}</span>`).join("")}

function predictMatch(a,b){
let A=data(a),B=data(b);
let aw=Math.round(winProb(a,b));
let bw=Math.round(100-aw-26);
let dr=100-aw-bw;
if(bw<8){bw=8;dr=100-aw-bw}
let pa=Math.max(38,Math.min(68,Math.round(50+(A.ctl-B.ctl)*.8)));
let pb=100-pa;
let xga=Math.max(.3,(A.atk*.04+A.ctl*.01-B.def*.025)).toFixed(2);
let xgb=Math.max(.3,(B.atk*.04+B.ctl*.01-A.def*.025)).toFixed(2);
let sa=Math.round(Number(xga)*5+4),sb=Math.round(Number(xgb)*5+4);
let oa=Math.max(1,Math.round(sa*.38)),ob=Math.max(1,Math.round(sb*.38));
let ca=Math.max(1,Math.round(pa/13+Number(xga))),cb=Math.max(1,Math.round(pb/13+Number(xgb)));
let ga=Math.max(0,Math.round(Number(xga))),gb=Math.max(0,Math.round(Number(xgb)));
if(aw>60&&ga<=gb)ga=gb+1;if(bw>55&&gb<=ga)gb=ga+1;
let top=[[ga+"-"+gb,22],[Math.max(0,ga+1)+"-"+gb,18],[ga+"-"+Math.max(0,gb-1),15],[Math.max(0,ga-1)+"-"+gb,12],[ga+"-"+(gb+1),10]];
let reason=`${a}综合强度${Math.round(strength(a))}，${b}综合强度${Math.round(strength(b))}。${A.ctl>B.ctl?a+"控球能力更强，预计掌握更多球权。":b+"控球能力更强，"+a+"可能更多依靠反击。"}模型倾向：${aw>=bw?a:b}不败。`;
return{aw,bw,dr,score:ga+"-"+gb,pa,pb,xga,xgb,sa,sb,oa,ob,ca,cb,top,reason,conf:Math.max(aw,bw,dr)}
}

async function getJSON(url){
const res=await fetch(url);
if(!res.ok)throw new Error("接口请求失败："+res.status);
return await res.json();
}

async function loadRealMatches(){
matches.innerHTML="<p class='muted'>正在读取实时比赛数据...</p>";
try{
let endpoint=mode.value==="live"?"/live":"/today";
const data=await getJSON(WORKER_URL+endpoint);
const list=data.response||[];
renderRealMatches(list);
update.innerHTML="实时数据更新时间："+new Date().toLocaleString()+"｜数据来源：API-Football + Cloudflare Worker";
}catch(e){
matches.innerHTML="<p class='muted'>实时数据读取失败："+e.message+"</p>";
}
}

async function loadStats(fixtureId,boxId){
const box=document.getElementById(boxId);
box.innerHTML="正在读取技术统计...";
try{
const data=await getJSON(WORKER_URL+"/stats?fixture="+fixtureId);
const arr=data.response||[];
if(!arr.length){box.innerHTML="暂无技术统计";return;}
box.innerHTML=arr.map(team=>{
let stats={};
team.statistics.forEach(s=>stats[s.type]=s.value);
return `<div class="box">
<h3>${team.team.name}</h3>
<p>控球率：${stats["Ball Possession"]||"暂无"}</p>
<p>射门：${stats["Total Shots"]||"暂无"}</p>
<p>射正：${stats["Shots on Goal"]||"暂无"}</p>
<p>角球：${stats["Corner Kicks"]||"暂无"}</p>
<p>黄牌：${stats["Yellow Cards"]||"暂无"}</p>
<p>红牌：${stats["Red Cards"]||"暂无"}</p>
</div>`;
}).join("");
}catch(e){box.innerHTML="技术统计读取失败";}
}

function renderRealMatches(list){
if(!list.length){
matches.innerHTML="<p class='muted'>当前接口没有读取到比赛。</p>";
return;
}
let html="";
list.forEach((m,i)=>{
const fixture=m.fixture;
const league=m.league;
const home=m.teams.home.name;
const away=m.teams.away.name;
const homeLogo=m.teams.home.logo;
const awayLogo=m.teams.away.logo;
const gh=m.goals.home ?? "-";
const ga=m.goals.away ?? "-";
const short=fixture.status.short;
const elapsed=fixture.status.elapsed;
const venue=fixture.venue?.name||"暂无球场信息";
const time=new Date(fixture.date).toLocaleString();
let badge=short==="FT"?`<span class="done">已完赛</span>`:elapsed?`<span class="live">🔴 LIVE ${elapsed}'</span>`:`<span class="future">未开始</span>`;
let p=predictMatch(home,away);
let statsId="stats_"+i;

html+=`<div class="match">
<div class="center">
<p>${badge}</p>
<p class="muted">${league.name}｜${league.country}</p>

<div class="row">
<div><img class="logo" src="${homeLogo}"><h2 class="orange">${home}</h2></div>
<div><h1>VS</h1><p>${time}</p><p>${venue}</p></div>
<div><img class="logo" src="${awayLogo}"><h2 class="yellow">${away}</h2></div>
</div>

<div class="score">${gh}-${ga}</div>
</div>

<h3>实时技术统计</h3>
<button onclick="loadStats(${fixture.id},'${statsId}')">读取控球率/射门/角球</button>
<div id="${statsId}" class="grid"></div>

<h3>AI比分预测 TOP5</h3>
${p.top.map((s,n)=>`<p>${n+1}. ${s[0]}｜${s[1]}%</p><div class="barbg"><div class="bar" style="width:${s[1]*4}%"></div></div>`).join("")}

<h3>胜平负概率</h3>
<p>${home}胜 ${p.aw}%｜平局 ${p.dr}%｜${away}胜 ${p.bw}%</p>
<div class="barbg">
<div style="height:100%;width:${p.aw}%;background:#f97316;float:left"></div>
<div style="height:100%;width:${p.dr}%;background:#94a3b8;float:left"></div>
<div style="height:100%;width:${p.bw}%;background:#facc15;float:left"></div>
</div>

<h3>近期状态</h3>
<div class="row"><div>${formHTML(home)}</div><div>${formHTML(away)}</div></div>

<div class="grid">
<div class="box"><h3>历史交锋</h3><p>实时版暂未接入H2H接口。</p><p class="small">下一版可增加 /h2h 接口。</p></div>
<div class="box"><h3>AI赛前理由</h3><p class="ai">${p.reason}</p></div>
</div>

<h3>AI最终结论</h3>
<p class="score">${p.aw>=p.bw?home:away} 不败</p>
<p>信心指数：${p.conf}%</p>
</div>`;
});
matches.innerHTML=html;
}

function predictTeam(){
let t=team.value,x=data(t);
teamResult.innerHTML=`<div class="match"><div class="flag">${flag[t]||"⚽"}</div><div class="big">${t}</div><p>${groupOf(t)}组｜夺冠概率 ${x.prob}%｜FIFA积分 ${x.elo}</p><div class="barbg"><div class="bar" style="width:${x.prob*3}%"></div></div><div class="grid"><div class="box">进攻 ${x.atk}</div><div class="box">防守 ${x.def}</div><div class="box">控球 ${x.ctl}</div><div class="box">综合 ${Math.round(strength(t))}</div></div><h3>核心球员</h3><p>${players[t]||"暂无详细核心球员数据"}</p></div>`;
}

function simulateTournament(){
let winners=[];
Object.keys(groups).forEach(g=>{let arr=[...groups[g]].sort((a,b)=>strength(b)-strength(a));winners.push(arr[0],arr[1])});
while(winners.length>1){let next=[];for(let i=0;i<winners.length;i+=2)next.push(pickWinner(winners[i],winners[i+1]));winners=next}
return winners[0];
}

function simulateMany(){
let count={};allTeams().forEach(t=>count[t]=0);
for(let i=0;i<10000;i++)count[simulateTournament()]++;
let top=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,10);
manySim.innerHTML=`<div class="match"><h3>10000次模拟冠军统计</h3>${top.map(x=>`<p>${flag[x[0]]} ${x[0]}：${x[1]}次｜${(x[1]/100).toFixed(1)}%</p><div class="barbg"><div class="bar" style="width:${x[1]/100}%"></div></div>`).join("")}</div>`;
}

function renderRanking(){
let top=allTeams().sort((a,b)=>data(b).prob-data(a).prob).slice(0,20);
ranking.innerHTML=top.map((t,i)=>`<p>${i+1}. ${flag[t]} ${t}｜${data(t).prob}%</p><div class="barbg"><div class="bar" style="width:${data(t).prob*3}%"></div></div>`).join("");
}

function init(){
team.innerHTML=allTeams().map(t=>`<option value="${t}">${flag[t]} ${t}｜${groupOf(t)}组</option>`).join("");
predictTeam();
renderRanking();
loadRealMatches();
setInterval(loadRealMatches,60000);
}

init();
</script>
</body>
</html>
