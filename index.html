function init(){
initSelect();
initDateSelect();
predict();
renderMatches();
renderSemis();
renderMVP();
renderGroups();
renderBracket();

function initSelect(){
let html="";
Object.keys(teams).filter(n=>teams[n].rank<=10).forEach(name=>{
html+=`<option value="${name}">${teams[name].flag} ${name}</option>`;
});
document.getElementById("team").innerHTML=html;
}

function initDateSelect(){
let dates=[...new Set(schedule.map(m=>m.date))];
let html="";
dates.forEach(d=>{
html+=`<option value="${d}" ${d===todayDate?"selected":""}>${d}</option>`;
});
document.getElementById("matchDate").innerHTML=html;
}

function getTeam(name){
return teams[name] || {flag:"⚪",prob:1,rank:99,attack:62,defense:62,control:62,players:["暂无数据"],analysis:"该队数据尚未接入模型。"};
}

function strength(name){
let t=getTeam(name);
return t.attack*0.45+t.defense*0.35+t.control*0.2;
}

function predictMatch(home,away){
let h=strength(home);
let a=strength(away);
let diff=h-a;

let homeWin=Math.round(38+diff*1.1);
let awayWin=Math.round(34-diff*0.9);
homeWin=Math.max(12,Math.min(78,homeWin));
awayWin=Math.max(8,Math.min(70,awayWin));
let draw=100-homeWin-awayWin;
if(draw<8){draw=8;homeWin-=4;awayWin-=4;}

let hg=Math.max(0,Math.round((h-58)/18));
let ag=Math.max(0,Math.round((a-58)/20));
if(homeWin>60 && hg<=ag)hg=ag+1;
if(awayWin>55 && ag<=hg)ag=hg+1;

let confidence=Math.max(homeWin,awayWin,draw);
let homeOdds=(100/homeWin).toFixed(2);
let drawOdds=(100/draw).toFixed(2);
let awayOdds=(100/awayWin).toFixed(2);

let scores=[
{score:hg+"-"+ag,p:32},
{score:Math.max(0,hg-1)+"-"+ag,p:22},
{score:hg+"-"+Math.max(0,ag-1),p:18}
];

return {homeWin,draw,awayWin,score:hg+"-"+ag,confidence,homeOdds,drawOdds,awayOdds,scores};
}

function predict(){
let name=document.getElementById("team").value;
let t=getTeam(name);
document.getElementById("result").innerHTML=`
<div class="result">
<div class="big">${t.flag} ${name}</div>
<p>🏆 夺冠概率：<b>${t.prob}%</b></p>
<p>📊 全球排名：第 <b>${t.rank}</b> 名</p>
<div class="bar-bg"><div class="bar" style="width:${t.prob}%"></div></div>
<h3>球队指数</h3>

<div class="stat">进攻：${t.attack}</div>
<div class="stat">防守：${t.defense}</div>
<div class="stat">控球：${t.control}</div>

</div>

<p>${t.players.join(" · ")}</p>
<h3>AI分析</h3>
<p class="ai">${t.analysis}</p>
</div>`;
}

function renderMatches(){
let d=document.getElementById("matchDate").value || todayDate;
let games=schedule.filter(m=>m.date===d);
let html="";

games.forEach(m=>{
let p=predictMatch(m.home,m.away);

html+=`
<div class="result">
<h3>${m.date} ${m.time}</h3>
<p class="small">🏆 ${m.stage}</p>
<div class="big">${getTeam(m.home).flag} ${m.home} vs ${getTeam(m.away).flag} ${m.away}</div>

<p>预测比分：</p>
<div class="score">${p.score}</div>

<p>AI信心指数：${p.confidence}%</p>
<div class="bar-bg"><div class="bar" style="width:${p.confidence}%"></div></div>

<p>${m.home}胜：${p.homeWin}%｜赔率 ${p.homeOdds}</p>
<div class="bar-bg"><div class="bar" style="width:${p.homeWin}%"></div></div>

<p>平局：${p.draw}%｜赔率 ${p.drawOdds}</p>
<div class="bar-bg"><div class="bar" style="width:${p.draw}%"></div></div>

<p>${m.away}胜：${p.awayWin}%｜赔率 ${p.awayOdds}</p>
<div class="bar-bg"><div class="bar" style="width:${p.awayWin}%"></div></div>

<h3>最可能比分 TOP3</h3>
<p>① ${p.scores[0].score}（${p.scores[0].p}%）</p>
<p>② ${p.scores[1].score}（${p.scores[1].p}%）</p>
<p>③ ${p.scores[2].score}（${p.scores[2].p}%）</p>

<h3>AI赛事分析</h3>
<p class="ai">
${m.home}综合强度为 ${Math.round(strength(m.home))}，
${m.away}综合强度为 ${Math.round(strength(m.away))}。
模型预测 ${p.homeWin>p.awayWin?m.home:m.away} 不败机会更高。
</p>
</div>`;
});

document.getElementById("matches").innerHTML=html;
}

function simulateCup(){
let ranking=Object.entries(teams).filter(x=>x[1].rank<=10).sort((a,b)=>b[1].prob-a[1].prob);
let weighted=[];
ranking.forEach(item=>{for(let i=0;i<item[1].prob;i++)weighted.push(item);});

let champion=weighted[Math.floor(Math.random()*weighted.length)];
let runner;
do{runner=ranking[Math.floor(Math.random()*5)];}while(runner[0]===champion[0]);
let third;
do{third=ranking[Math.floor(Math.random()*7)];}while(third[0]===champion[0]||third[0]===runner[0]);

document.getElementById("simulator").innerHTML=`
<div class="result">
<h3>🏆 模拟结果</h3>
<p>冠军：${champion[1].flag} ${champion[0]}</p>
<p>亚军：${runner[1].flag} ${runner[0]}</p>
<p>季军：${third[1].flag} ${third[0]}</p>
<p class="small">本模拟根据冠军概率加权随机生成。</p>
</div>`;
}

html+=`
<div class="rank-row">
<div>${index+1}. ${t.flag} ${name} <span class="small">${t.prob}%</span></div>
<div class="bar-bg"><div class="bar" style="width:${t.prob}%"></div></div>
</div>`;
});
document.getElementById("ranking").innerHTML=html;
}

function renderChart(){
let labels=Object.keys(teams).filter(n=>teams[n].rank<=10);
let values=labels.map(t=>teams[t].prob);
new Chart(document.getElementById("championChart"),{
type:"doughnut",
data:{labels:labels,datasets:[{data:values}]},
options:{plugins:{legend:{labels:{color:"white"}}}}
});
}

function generateReport(){
let top=Object.entries(teams).filter(x=>x[1].rank<=10).sort((a,b)=>b[1].prob-a[1].prob)[0];

<div class="result">

<p class="ai">
当前模型最看好 ${top[1].flag} ${top[0]}。

防守指数 ${top[1].defense}，控球指数 ${top[1].control}。
综合来看，${top[0]} 具备最强的夺冠稳定性。
</p>
</div>`;
}

function renderUpdateTime(){
document.getElementById("update").innerHTML=
"最后更新："+new Date().toLocaleString()+"｜预测仅供分析，不构成投注建议。";
}
