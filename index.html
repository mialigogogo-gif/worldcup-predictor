<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界杯预测系统</title>

<style>
body{
font-family:-apple-system;
background:#0f172a;
color:white;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

select{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:10px;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:16px;
}

.result{
margin-top:15px;
font-size:20px;
font-weight:bold;
color:#38bdf8;
}
</style>
</head>

<body>

<h1>⚽ 世界杯冠军预测</h1>

<div class="card">

<h2>选择支持球队</h2>

<select id="team">
<option>阿根廷</option>
<option>法国</option>
<option>巴西</option>
<option>德国</option>
<option>英格兰</option>
<option>西班牙</option>
</select>

<button onclick="predict()">
开始预测
</button>

<div class="result" id="result"></div>

</div>

<script>

function predict(){

let team =
document.getElementById("team").value;

let data = {
"阿根廷":"27%",
"法国":"14%",
"巴西":"16%",
"德国":"13%",
"英格兰":"12%",
"西班牙":"11%"
};

document.getElementById("result").innerHTML =
team + " 夺冠概率：" + data[team];

}

</script>

</body>
</html>
