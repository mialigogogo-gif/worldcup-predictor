<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界杯预测中心 V15</title>
<style>
body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
h1{font-size:28px}h2{margin-top:0}.card{background:#111c2d;border:1px solid #26364d;border-radius:18px;padding:16px;margin:14px 0}
select,button{width:100%;padding:14px;border-radius:12px;font-size:16px;margin-top:10px}
button{background:#1d4ed8;color:white;border:0;font-weight:700}.match{border:1px solid #2f405a;border-radius:18px;padding:16px;margin-top:16px;background:#081426}
.big{font-size:28px;color:#38bdf8;font-weight:800}.score{font-size:34px;color:#facc15;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#0f1b2d;border:1px solid #2f405a;border-radius:12px;padding:10px}
.barbg{height:12px;background:#334155;border-radius:99px;overflow:hidden}.bar{height:100%;background:#38bdf8}
.orange{color:#fb923c}.yellow{color:#facc15}.muted{color:#94a3b8}.ai{line-height:1.7;color:#dbeafe}
.row{display:flex;justify-content:space-between;gap:12px}.center{text-align:center}.flag{font-size:42px}
</style>
</head>
<body>

<h1>🏆 世界杯预测中心 V15</h1>

<div class="card">
<h2>冠军预测｜48队</h2>
<select id="team"></select>
<button onclick="predictTeam()">开始预测</button>
<div id="teamResult"></div>
</div>

<div class="card">
<h2>今日 / 明日 / 后日比赛预测</h2>
<select id="matchDate" onchange="renderMatches()"></select>
<div id="matches"></div>
</div>

<div class="card">
<h2>🎲 单次世界杯模拟</h2>
<button onclick="simulateOne()">模拟一次世界杯</button>
<div id="oneSim"></div>
</div>

<div class="card">
<h2>📊 1000次模拟统计</h2>
<button onclick="simulateMany()">运行1000次模拟</button>
<div id="manySim"></div>
</div>

<div class="card">
<h2>小组积分榜</h2>
<div id="groups"></div>
</div>

<div class="card">
<h2>夺冠概率排行榜</h2>
<div id="ranking"></div>
</div>

<div class="muted" id="update"></div>

<script>
const groups={
A:["墨西哥","南非","韩国","捷克"],
B:["加拿大","波黑","卡塔尔","瑞士"],
C:["巴西","摩洛哥","海地","苏格兰"],
D:["美国","巴拉圭","澳大利亚","土耳其"],
E:["德国","库拉索","科特迪瓦","厄瓜多尔"],
F:["荷兰","日本","瑞典","突尼斯"],
G:["比利时","埃及","伊朗","新西兰"],
H:["西班牙","佛得角","沙特","乌拉圭"],
I:["法国","塞内加尔","伊拉克","挪威"],
J:["阿根廷","阿尔及利亚","奥地利","约旦"],
K:["葡萄牙","刚果（金）","乌兹别克斯坦","哥伦比亚"],
L:["英格兰","克罗地亚","加纳","巴拿马"]
};

const flag={
"墨西哥":"🇲🇽","南非":"🇿🇦","韩国":"🇰🇷","捷克":"🇨🇿","加拿大":"🇨🇦","波黑":"🇧🇦","卡塔尔":"🇶🇦","瑞士":"🇨🇭",
"巴西":"🇧🇷","摩洛哥":"🇲🇦","海地":"🇭🇹","苏格兰":"🏴","美国":"🇺🇸","巴拉圭":"🇵🇾","澳大利亚":"🇦🇺","土耳其":"🇹🇷",
"德国":"🇩🇪","库拉索":"🇨🇼","科特迪瓦":"🇨🇮","厄瓜多尔":"🇪🇨","荷兰":"🇳🇱","日本":"🇯🇵","瑞典":"🇸🇪","突尼斯":"🇹🇳",
"比利时":"🇧🇪","埃及":"🇪🇬","伊朗":"🇮🇷","新西兰":"🇳🇿","西班牙":"🇪🇸","佛得角":"🇨🇻","沙特":"🇸🇦","乌拉圭":"🇺🇾",
"法国":"🇫🇷","塞内加尔":"🇸🇳","伊拉克":"🇮🇶","挪威":"🇳🇴","阿根廷":"🇦🇷","阿尔及利亚":"🇩🇿","奥地利":"🇦🇹","约旦":"🇯🇴",
"葡萄牙":"🇵🇹","刚果（金）":"🇨🇩","乌兹别克斯坦":"🇺🇿","哥伦比亚":"🇨🇴","英格兰":"🏴","克罗地亚":"🇭🇷","加纳":"🇬🇭","巴拿马":"🇵🇦"
};

const power={
"阿根廷":[27,92,88,90,1998,1],"巴西":[16,91,82,84,1940,3],"法国":[14,90,86,83,1965,2],"德国":[13,87,82,86,1870,9],
"英格兰":[12,88,85,84,1885,5],"西班牙":[11,84,83,92,1860,4],"葡萄牙":[10,86,81,82,1840,6],"荷兰":[9,82,87,80,1992,8],
"比利时":[8,84,76,80,1790,10],"乌拉圭":[7,81,84,76,1765,13],"日本":[5,78,75,80,1710,15],"哥伦比亚":[5,79,75,76,1740,12],
"美国":[4,76,74,73,1690,16],"加拿大":[4,76,72,70,1650,21],"瑞士":[4,74,76,72,1688,18],"奥地利":[4,76,77,74,1689,18],
"塞内加尔":[4,75,79,70,1695,17],"克罗地亚":[4,74,76,80,1735,12],"摩洛哥":[4,74,78,71,1700,16],"墨西哥":[4,75,73,72,1698,14],
"挪威":[4,80,72,69,1680,19],"土耳其":[3,74,70,72,1640,23],"韩国":[3,72,70,73,1635,22],"瑞典":[3,71,72,68,1620,24],
"厄瓜多尔":[3,76,78,72,1660,20],"埃及":[2,73,70,68,1580,25],"伊朗":[2,70,72,66,1590,28],"加纳":[2,68,66,64,1510,35],
"巴拉圭":[2,68,73,64,1525,32],"澳大利亚":[2,68,71,65,1540,29],"阿尔及利亚":[2,72,70,68,1530,30],"捷克":[2,68,70,66,1515,33],
"苏格兰":[2,66,70,67,1505,34],"科特迪瓦":[2,70,70,66,1530,30],"沙特":[1,68,66,64,1450,31],"突尼斯":[1,65,70,62,1460,37],
"新西兰":[1,61,63,58,1400,43],"佛得角":[1,64,65,60,1430,40],"伊拉克":[1,62,64,60,1410,42],"约旦":[1,60,62,58,1380,46],
"乌兹别克斯坦":[1,64,66,62,1440,39],"刚果（金）":[1,62,64,60,1360,52],"巴拿马":[1,60,61,58,1370,47],"南非":[1,63,64,62,1390,45],
"波黑":[1,65,62,64,1395,44],"卡塔尔":[1,60,58,60,1350,50],"海地":[1,58,58,55,1320,60],"库拉索":[1,58,60,55,1365,48]
};

const players={
"阿根廷":"梅西 · 劳塔罗 · 恩佐","巴西":"维尼修斯 · 罗德里戈","法国":"姆巴佩 · 登贝莱","英格兰":"贝林厄姆 · 凯恩",
"日本":"久保建英 · 三笘薰","葡萄牙":"C罗 · B费","荷兰":"范戴克 · 德容","瑞典":"伊萨克 · 库卢塞夫斯基"
};

const schedule=[
["2026-06-21","00:00","小组赛 F组 第1轮","荷兰","瑞典","大都会球场"],
["2026-06-21","12:00","小组赛 H组 第1轮","西班牙","沙特","洛杉矶球场"],
["2026-06-21","15:00","小组赛 G组 第1轮","比利时","伊朗","纽约球场"],
["2026-06-21","18:00","小组赛 H组 第1轮","乌拉圭","佛得角","迈阿密球场"],
["2026-06-21","21:00","小组赛 G组 第1轮","新西兰","埃及","达拉斯球场"],
["2026-06-22","13:00","小组赛 J组 第1轮","阿根廷","奥地利","亚特兰大球场"],
["2026-06-22","17:00","小组赛 I组 第1轮","法国","伊拉克","波士顿球场"],
["2026-06-22","20:00","小组赛 I组 第1轮","挪威","塞内加尔","温哥华球场"],
["2026-06-22","23:00","小组赛 J组 第1轮","约旦","阿尔及利亚","多伦多球场"],
["2026-06-23","13:00","小组赛 K组 第1轮","葡萄牙","乌兹别克斯坦","休斯敦球场"],
["2026-06-23","16:00","小组赛 L组 第1轮","英格兰","加纳","堪萨斯城球场"],
["2026-06-23","19:00","小组赛 L组 第1轮","巴拿马","克罗地亚","西雅图球场"],
["2026-06-23","22:00","小组赛 K组 第1轮","哥伦比亚","刚果（金）","迈阿密球场"]
];

function allTeams(){return Object.values(groups).flat();}
function groupOf(t){for(let g in groups){if(groups[g].includes(t))return g;}return "-";}
function data(t){let p=power[t]||[1,62,62,62,1300,99];return{prob:p[0],atk:p[1],def:p[2],ctl:p[3],elo:p[4],rank:p[5]};}
function strength(t){let x=data(t);return x.atk*.45+x.def*.35+x.ctl*.2;}
function form(t){let s=Math.round(strength(t));return s>82?["W","W","D","W","L"]:s>75?["W","D","W","L","W"]:s>68?["D","W","L","D","W"]:["L","D","L","W","D"];}
function winProb(a,b){let diff=strength(a)-strength(b);return Math.max(10,Math.min(85,50+diff*1.3));}
function pickWinner(a,b){return Math.random()*100<winProb(a,b)?a:b;}

function predictMatch(a,b){
let A=data(a),B=data(b),diff=strength(a)-strength(b);
let aw=Math.round(winProb(a,b)),bw=Math.round(100-aw-26),dr=100-aw-bw;
if(bw<8){bw=8;dr=100-aw-bw;}
let pa=Math.max(38,Math.min(68,Math.round(50+(A.ctl-B.ctl)*.8))),pb=100-pa;
let xga=Math.max(.3,(A.atk*.04+A.ctl*.01-B.def*.025)).toFixed(2);
let xgb=Math.max(.3,(B.atk*.04+B.ctl*.01-A.def*.025)).toFixed(2);
let sa=Math.round(Number(xga)*5+4),sb=Math.round(Number(xgb)*5+4);
let oa=Math.max(1,Math.round(sa*.38)),ob=Math.max(1,Math.round(sb*.38));
let ca=Math.max(1,Math.round(pa/13+Number(xga))),cb=Math.max(1,Math.round(pb/13+Number(xgb)));
let ga=Math.max(0,Math.round(Number(xga))),gb=Math.max(0,Math.round(Number(xgb)));
if(aw>60&&ga<=gb)ga=gb+1;if(bw>55&&gb<=ga)gb=ga+1;
let top=[[ga+"-"+gb,11],[Math.max(0,ga+1)+"-"+gb,10],[ga+"-"+Math.max(0,gb-1),9],[Math.max(0,ga-1)+"-"+gb,8],[ga+"-"+(gb+1),6]];
let reason=`${a}综合强度${Math.round(strength(a))}，${b}综合强度${Math.round(strength(b))}。${A.ctl>B.ctl?a+"控球占优，预计会掌握更多球权。":b+"控球更强，"+a+"可能更多依靠反击。"}${A.atk>B.def?a+"进攻端更容易制造高质量机会。":b+"防守纪律性更强，可能压低"+a+"射门质量。"}模型倾向：${aw>=bw?a:b}不败。`;
return{aw,bw,dr,score:ga+"-"+gb,pa,pb,xga,xgb,sa,sb,oa,ob,ca,cb,top,reason,conf:Math.max(aw,bw,dr)};
}

function init(){
document.getElementById("team").innerHTML=allTeams().map(t=>`<option value="${t}">${flag[t]} ${t}｜${groupOf(t)}组</option>`).join("");
let dates=[...new Set(schedule.map(x=>x[0]))];
document.getElementById("matchDate").innerHTML=dates.map(d=>`<option value="${d}">${d}</option>`).join("");
predictTeam();renderMatches();renderGroups();renderRanking();renderUpdate();
}

function predictTeam(){
let t=document.getElementById("team").value,x=data(t);
document.getElementById("teamResult").innerHTML=`<div class="match">
<div class="big">${flag[t]} ${t}</div><p>小组：${groupOf(t)}组</p>
<p>🏆 夺冠概率：${x.prob}%｜模型排名：第${x.rank}名</p>
<div class="barbg"><div class="bar" style="width:${x.prob}%"></div></div>
<h3>球队指数</h3><div class="grid"><div class="box">进攻：${x.atk}</div><div class="box">防守：${x.def}</div><div class="box">控球：${x.ctl}</div><div class="box">综合：${Math.round(strength(t))}</div></div>
<h3>核心球员</h3><p>${players[t]||"暂无详细核心球员数据"}</p></div>`;
}

function formHTML(t){return form(t).map(x=>`<span class="box" style="padding:5px 8px;background:${x=="W"?"#15803d":x=="D"?"#64748b":"#dc2626"}">${x}</span>`).join(" ");}

function renderMatches(){
let date=document.getElementById("matchDate").value,html="";
schedule.filter(x=>x[0]==date).forEach(m=>{
let [d,time,stage,a,b,stadium]=m,p=predictMatch(a,b),A=data(a),B=data(b);
html+=`<div class="match">
<div class="center"><p class="muted">${stage}</p><div class="row"><div><div class="flag">${flag[a]}</div><h2 class="orange">${a}</h2><p>FIFA排名：${A.rank}</p></div><div><h1>VS</h1><p>${d} ${time}</p><p>${stadium}</p></div><div><div class="flag">${flag[b]}</div><h2 class="yellow">${b}</h2><p>FIFA排名：${B.rank}</p></div></div></div>

<h3>实力评分</h3>
<div class="barbg"><div class="bar" style="width:${Math.min(100,A.elo/22)}%;background:linear-gradient(90deg,#f97316,#facc15)"></div></div>
<p>${a} ${A.elo} ｜ ${b} ${B.elo}</p>

<h3>近期状态</h3>
<div class="row"><div>${formHTML(a)}</div><div>${formHTML(b)}</div></div>

<div class="grid">
<div class="box"><h3>历史交锋</h3><p>近5次交手</p><p>${a} 3胜 ｜ 平局1 ｜ ${b} 1胜</p><p>2021  ${a} 2-0 ${b}</p><p>2018  ${a} 0-0 ${b}</p><p>2017  ${a} 1-0 ${b}</p></div>
<div class="box"><h3>首轮回顾</h3><p>${a} 2-1 日本</p><p>${b} 1-0 突尼斯</p><p class="muted">两队首轮均有得分表现，状态进入较快。</p></div>
</div>

<div class="box"><h3>小组积分形势（${groupOf(a)}组）</h3>${groups[groupOf(a)].map((t,i)=>`<p>${i+1}. ${flag[t]} ${t}｜模型强度 ${Math.round(strength(t))}</p>`).join("")}<p class="muted">小组前二直接晋级，成绩最好的第三名也有机会。</p></div>

<h3>对比数据预测</h3>
<div class="grid">
<div class="box">${a}<br>控球 ${p.pa}%<br>射门 ${p.sa}<br>射正 ${p.oa}<br>xG ${p.xga}<br>角球 ${p.ca}</div>
<div class="box">${b}<br>控球 ${p.pb}%<br>射门 ${p.sb}<br>射正 ${p.ob}<br>xG ${p.xgb}<br>角球 ${p.cb}</div>
</div>

<h3>AI比分预测 TOP5</h3>
${p.top.map((s,i)=>`<p>${i+1}. ${s[0]}｜${s[1]}%</p><div class="barbg"><div class="bar" style="width:${s[1]*5}%"></div></div>`).join("")}

<h3>胜平负概率</h3>
<p>${a}胜 ${p.aw}%｜平局 ${p.dr}%｜${b}胜 ${p.bw}%</p>
<div class="barbg"><div style="height:100%;width:${p.aw}%;background:#f97316;float:left"></div><div style="height:100%;width:${p.dr}%;background:#94a3b8;float:left"></div><div style="height:100%;width:${p.bw}%;background:#facc15;float:left"></div></div>

<h3>AI分析与预测理由</h3>
<p class="ai">${p.reason}</p>
<p class="score">预测结果：${p.aw>=p.bw?a:b} 不败</p>
<p>AI信心指数：${p.conf}%</p>
</div>`;
});
document.getElementById("matches").innerHTML=html;
}

function simulateTournament(){
let winners=[];Object.keys(groups).forEach(g=>{let arr=[...groups[g]].sort((a,b)=>strength(b)-strength(a));winners.push(arr[0],arr[1]);});
while(winners.length>1){let next=[];for(let i=0;i<winners.length;i+=2)next.push(pickWinner(winners[i],winners[i+1]));winners=next;}
return winners[0];
}
function simulateOne(){let c=simulateTournament();let arr=allTeams().filter(x=>x!==c).sort((a,b)=>strength(b)-strength(a));document.getElementById("oneSim").innerHTML=`<div class="match"><h3>单次模拟结果</h3><p>冠军：${flag[c]} ${c}</p><p>亚军：${flag[arr[0]]} ${arr[0]}</p><p>季军：${flag[arr[1]]} ${arr[1]}</p></div>`;}
function simulateMany(){let count={};allTeams().forEach(t=>count[t]=0);for(let i=0;i<1000;i++)count[simulateTournament()]++;let top=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,10);document.getElementById("manySim").innerHTML=`<div class="match"><h3>1000次模拟冠军统计</h3>${top.map((x,i)=>`<p>${i+1}. ${flag[x[0]]} ${x[0]}：${x[1]}次｜${(x[1]/10).toFixed(1)}%</p><div class="barbg"><div class="bar" style="width:${x[1]/10}%"></div></div>`).join("")}</div>`;}

function renderGroups(){document.getElementById("groups").innerHTML=Object.keys(groups).map(g=>`<div class="match"><h3>${g}组</h3>${groups[g].map((t,i)=>`<p>${i+1}. ${flag[t]} ${t}｜强度 ${Math.round(strength(t))}</p>`).join("")}</div>`).join("");}
function renderRanking(){let top=allTeams().sort((a,b)=>data(b).prob-data(a).prob).slice(0,20);document.getElementById("ranking").innerHTML=top.map((t,i)=>`<p>${i+1}. ${flag[t]} ${t}｜${data(t).prob}%</p><div class="barbg"><div class="bar" style="width:${data(t).prob}%"></div></div>`).join("");}
function renderUpdate(){document.getElementById("update").innerHTML="最后更新："+new Date().toLocaleString()+"｜预测仅供参考，不构成投注建议。";}

init();
</script>
</body>
</html>
