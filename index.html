function getTeam(n){return teams[n]||{flag:"⚪",prob:1,rank:99,attack:62,defense:62,control:62,players:["暂无数据"],analysis:"该队数据尚未接入模型。"}}
function strength(n){let t=getTeam(n);return t.attack*.45+t.defense*.35+t.control*.2}

function predictMatch(h,a){
let hs=strength(h),as=strength(a),diff=hs-as;
let hw=Math.max(12,Math.min(78,Math.round(38+diff*1.1)));
let aw=Math.max(8,Math.min(70,Math.round(34-diff*.9)));
let dr=100-hw-aw;if(dr<8){dr=8;hw-=4;aw-=4}
let hg=Math.max(0,Math.round((hs-58)/18)),ag=Math.max(0,Math.round((as-58)/20));
if(hw>60&&hg<=ag)hg=ag+1;if(aw>55&&ag<=hg)ag=hg+1;
return{hw,dr,aw,score:hg+"-"+ag,conf:Math.max(hw,dr,aw),ho:(100/hw).toFixed(2),do:(100/dr).toFixed(2),ao:(100/aw).toFixed(2),scores:[hg+"-"+ag,Math.max(0,hg-1)+"-"+ag,hg+"-"+Math.max(0,ag-1)]}
}

function init(){
document.getElementById("team").innerHTML=Object.keys(teams).filter(n=>teams[n].rank<=10).map(n=>`<option value="${n}">${teams[n].flag} ${n}</option>`).join("");
let ds=[...new Set(schedule.map(x=>x.date))];
document.getElementById("matchDate").innerHTML=ds.map(d=>`<option value="${d}" ${d==todayDate?"selected":""}>${d}</option>`).join("");
predict();renderMatches();renderRanking();renderGroups();renderSemis();renderMVP();renderBracket();renderChart();renderUpdate();
}

function predict(){
let n=document.getElementById("team").value,t=getTeam(n);
document.getElementById("result").innerHTML=`<div class="result"><div class="big">${t.flag} ${n}</div><p>🏆 夺冠概率：<b>${t.prob}%</b></p><p>📊 全球排名：第 <b>${t.rank}</b> 名</p><div class="bar-bg"><div class="bar" style="width:${t.prob}%"></div></div><h3>球队指数</h3><div class="grid"><div class="stat">进攻：${t.attack}</div><div class="stat">防守：${t.defense}</div><div class="stat">控球：${t.control}</div><div class="stat">冠军概率：${t.prob}%</div></div><h3>核心球员</h3><p>${t.players.join(" · ")}</p><h3>AI分析</h3><p class="ai">${t.analysis}</p></div>`;
}

function renderMatches(){
let d=document.getElementById("matchDate").value||todayDate,html="";
schedule.filter(m=>m.date==d).forEach(m=>{
let p=predictMatch(m.home,m.away);
html+=`<div class="result"><h3>${m.date} ${m.time}</h3><p class="small">🏆 ${m.stage}</p><div class="big">${getTeam(m.home).flag} ${m.home} vs ${getTeam(m.away).flag} ${m.away}</div><p>预测比分：</p><div class="score">${p.score}</div><p>AI信心指数：${p.conf}%</p><div class="bar-bg"><div class="bar" style="width:${p.conf}%"></div></div><p>${m.home}胜：${p.hw}%｜赔率 ${p.ho}</p><div class="bar-bg"><div class="bar" style="width:${p.hw}%"></div></div><p>平局：${p.dr}%｜赔率 ${p.do}</p><div class="bar-bg"><div class="bar" style="width:${p.dr}%"></div></div><p>${m.away}胜：${p.aw}%｜赔率 ${p.ao}</p><div class="bar-bg"><div class="bar" style="width:${p.aw}%"></div></div><h3>最可能比分 TOP3</h3><p>① ${p.scores[0]}</p><p>② ${p.scores[1]}</p><p>③ ${p.scores[2]}</p><h3>AI赛事分析</h3><p class="ai">${m.home}综合强度 ${Math.round(strength(m.home))}，${m.away}综合强度 ${Math.round(strength(m.away))}。模型认为${p.hw>=p.aw?m.home:m.away}不败机会更高。</p></div>`;
});
document.getElementById("matches").innerHTML=html;
}

function simulateCup(){
let r=Object.entries(teams).filter(x=>x[1].rank<=10).sort((a,b)=>b[1].prob-a[1].prob),w=[];
r.forEach(x=>{for(let i=0;i<x[1].prob;i++)w.push(x)});
let c=w[Math.floor(Math.random()*w.length)],s,t;do{s=r[Math.floor(Math.random()*5)]}while(s[0]==c[0]);do{t=r[Math.floor(Math.random()*7)]}while(t[0]==c[0]||t[0]==s[0]);
document.getElementById("simulator").innerHTML=`<div class="result"><h3>🏆 模拟结果</h3><p>冠军：${c[1].flag} ${c[0]}</p><p>亚军：${s[1].flag} ${s[0]}</p><p>季军：${t[1].flag} ${t[0]}</p></div>`;
}

function renderRanking(){document.getElementById("ranking").innerHTML=Object.entries(teams).filter(x=>x[1].rank<=10).sort((a,b)=>b[1].prob-a[1].prob).map((x,i)=>`<div class="rank-row"><div>${i+1}. ${x[1].flag} ${x[0]} <span class="small">${x[1].prob}%</span></div><div class="bar-bg"><div class="bar" style="width:${x[1].prob}%"></div></div></div>`).join("")}
function renderSemis(){document.getElementById("semis").innerHTML=Object.entries(teams).filter(x=>x[1].rank<=10).sort((a,b)=>b[1].prob-a[1].prob).slice(0,4).map(x=>`<div class="stat"><div class="big">${x[1].flag}</div><b>${x[0]}</b><p class="small">四强热门</p></div>`).join("")}
function renderMVP(){document.getElementById("mvp").innerHTML=mvp.map((p,i)=>`<div class="rank-row"><div>${i+1}. ${p[0]} · ${p[1]} <span class="small">${p[2]}%</span></div><div class="bar-bg"><div class="bar" style="width:${p[2]}%"></div></div></div>`).join("")}
function renderGroups(){document.getElementById("groups").innerHTML=Object.keys(groups).map(g=>`<div class="result"><h3>${g}组</h3>${groups[g].map((r,i)=>`<p>${i+1}. ${getTeam(r[0]).flag} ${r[0]} · ${r[1]}分</p>`).join("")}</div>`).join("")}
function renderBracket(){document.getElementById("bracket").innerHTML=`<div class="result"><p>16强：A2 vs B2</p><p>16强：F1 vs C2</p><p>16强：J1 vs 最佳第三名</p><p>半决赛预测：阿根廷 vs 巴西</p><p>半决赛预测：法国 vs 英格兰</p><p class="score">预测决赛：阿根廷 vs 法国</p></div>`}
function renderChart(){let labels=Object.keys(teams).filter(n=>teams[n].rank<=10),values=labels.map(n=>teams[n].prob);new Chart(document.getElementById("championChart"),{type:"doughnut",data:{labels,datasets:[{data:values}]},options:{plugins:{legend:{labels:{color:"white"}}}}})}
function generateReport(){let top=Object.entries(teams).filter(x=>x[1].rank<=10).sort((a,b)=>b[1].prob-a[1].prob)[0];document.getElementById("report").innerHTML=`<div class="result"><h3>AI总冠军报告</h3><p class="ai">当前模型最看好 ${top[1].flag} ${top[0]}，冠军概率 ${top[1].prob}%。该队攻防均衡，淘汰赛稳定性最高。</p></div>`}
function renderUpdate(){document.getElementById("update").innerHTML="最后更新："+new Date().toLocaleString()+"｜预测仅供分析，不构成投注建议。"}

init();
</script>
</body>
</html>
